# =============================================================================
# DEVICE SETTINGS PAGE — http://<device>.local/
# =============================================================================
# Every user setting (entities, brightness, timezone, ...) is edited on a page
# the panel serves itself, instead of being exposed to Home Assistant as config
# entities. The settings are still the same template text / number / select /
# switch entities, declared `internal: true` in their own files: they keep
# their NVS storage and their on_value / set_action triggers, and this page
# drives them through the same calls HA used to make.
#
# Entity pickers are filled from HA's /api/states, fetched on demand by the
# panel through the background HTTP worker with the `ha_token` substitution
# (without a token, entity ids can still be typed in).
#
# The page is open to anyone on the LAN unless settings_username is set, in
# which case the browser asks for these credentials (HTTP basic auth, sent in
# clear over plain http — it keeps out casual visitors, not an attacker on the
# network).
#
# To add a setting: declare the entity with `internal: true`, then list it
# below. Field order is page order; `group` makes the sections.
# =============================================================================

substitutions:
  settings_username: ""
  settings_password: ""

calendar_json:
  settings:
    id: settings_page
    fetcher: http_worker
    base_url: !lambda 'return id(ha_base_url);'
    token: !lambda 'return id(ha_token_global);'
    title: "${friendly_name}"
    username: "${settings_username}"
    password: "${settings_password}"
