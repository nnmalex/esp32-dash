# =============================================================================
# CLIMATE — thermostat + button subscriptions and HA actions
# =============================================================================
# Data side of the climate view (device/climate_view.yaml):
#
#   climate_entity_select_0..7       — up to 8 climate.* entities, one card each
#   climate_card_button_select_T_J   — up to 3 buttons under thermostat T
#   climate_button_select_0..5       — up to 6 entities for the bottom button row
#                                      (button, scene, script, light, switch, ...)
#
# All are NVS-persisted internal text entities edited on the device settings
# page (device/web_settings.yaml); the climate_entity_N, climate_entity_N_button_M
# and climate_button_N substitutions only seed them on first boot.
#
# Button slots (clim_btn_* arrays, CLIM_BTN = 30): 0..5 are the bottom row,
# 6 + T*3 + J is button J of thermostat T.
#
# Per thermostat the panel subscribes to the state (hvac mode) and the
# attributes friendly_name, current_temperature, temperature,
# target_temp_low/high, target_temp_step, min_temp, max_temp, hvac_action,
# hvac_modes, preset_mode and preset_modes. HA forwards attributes as
# str(value): numbers arrive as "21.5", a missing value as "None", and lists as
# Python reprs ("[<HVACMode.OFF: 'off'>, <HVACMode.HEAT: 'heat'>]" or
# "['none', 'boost']") — clim_parse_list takes the quoted tokens, which covers
# both forms.
#
# Taps call HA actions over the native API (homeassistant.action), like the
# music controls, so they need "Allow the device to perform Home Assistant
# actions" enabled on the device in HA. The +/− buttons only move a pending
# target locally; climate_pending_tick sends one set_temperature once the taps
# stop (CLIM_SEND_DELAY_MS), instead of one action per tap.
# =============================================================================

substitutions:
  climate_entity_1: ""
  climate_entity_1_button_1: ""
  climate_entity_1_button_2: ""
  climate_entity_1_button_3: ""
  climate_entity_2: ""
  climate_entity_2_button_1: ""
  climate_entity_2_button_2: ""
  climate_entity_2_button_3: ""
  climate_entity_3: ""
  climate_entity_3_button_1: ""
  climate_entity_3_button_2: ""
  climate_entity_3_button_3: ""
  climate_entity_4: ""
  climate_entity_4_button_1: ""
  climate_entity_4_button_2: ""
  climate_entity_4_button_3: ""
  climate_entity_5: ""
  climate_entity_5_button_1: ""
  climate_entity_5_button_2: ""
  climate_entity_5_button_3: ""
  climate_entity_6: ""
  climate_entity_6_button_1: ""
  climate_entity_6_button_2: ""
  climate_entity_6_button_3: ""
  climate_entity_7: ""
  climate_entity_7_button_1: ""
  climate_entity_7_button_2: ""
  climate_entity_7_button_3: ""
  climate_entity_8: ""
  climate_entity_8_button_1: ""
  climate_entity_8_button_2: ""
  climate_entity_8_button_3: ""
  climate_button_1: ""
  climate_button_2: ""
  climate_button_3: ""
  climate_button_4: ""
  climate_button_5: ""
  climate_button_6: ""

globals:
  # ---- Thermostats (8 slots) ------------------------------------------------
  # Validated entity per slot ("" = slot unused). Set even before the API is up,
  # so the view can lay itself out from it.
  - id: clim_entity
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  # Entity registered with the API's state-subscription list, per slot. ESPHome
  # has no unsubscribe (see weather_sensors.yaml), so a reconnect must not
  # subscribe again; the generation counter invalidates callbacks of an entity
  # that was replaced.
  - id: clim_subbed
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  - id: clim_gen
    type: std::array<int, 8>
    initial_value: 'std::array<int, 8>{}'

  - id: clim_name
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  # Entity state = hvac mode ("off", "heat", ...) or "unavailable".
  - id: clim_state
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  - id: clim_action
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  - id: clim_preset
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'
  # Last mode other than off, so the power button can restore it.
  - id: clim_last_on_mode
    type: std::array<std::string, 8>
    initial_value: 'std::array<std::string, 8>{}'

  # Numeric attributes; NAN = not reported (or "None").
  - id: clim_cur
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_target
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_low
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_high
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_step
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_min
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_max
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'

  # hvac_modes without "off" (off is the power button), and whether off exists.
  - id: clim_modes
    type: std::array<std::vector<std::string>, 8>
    initial_value: 'std::array<std::vector<std::string>, 8>{}'
  - id: clim_has_off
    type: std::array<bool, 8>
    initial_value: 'std::array<bool, 8>{}'
  - id: clim_presets
    type: std::array<std::vector<std::string>, 8>
    initial_value: 'std::array<std::vector<std::string>, 8>{}'

  # Target set with +/− but not yet confirmed by HA (NAN = none). Sent once no
  # tap has come for CLIM_SEND_DELAY_MS; dropped when HA reports the new
  # target, or after CLIM_PENDING_TIMEOUT_MS if it never does (rejected call).
  - id: clim_pending
    type: std::array<float, 8>
    initial_value: 'std::array<float, 8>{NAN, NAN, NAN, NAN, NAN, NAN, NAN, NAN}'
  - id: clim_pending_ms
    type: std::array<uint32_t, 8>
    initial_value: 'std::array<uint32_t, 8>{}'
  - id: clim_pending_sent
    type: std::array<bool, 8>
    initial_value: 'std::array<bool, 8>{}'

  # ---- Buttons (30 slots: 6 bottom row + 3 per thermostat) -------------------------------------------------
  - id: clim_btn_entity
    type: std::array<std::string, 30>
    initial_value: 'std::array<std::string, 30>{}'
  - id: clim_btn_subbed
    type: std::array<std::string, 30>
    initial_value: 'std::array<std::string, 30>{}'
  - id: clim_btn_gen
    type: std::array<int, 30>
    initial_value: 'std::array<int, 30>{}'
  - id: clim_btn_name
    type: std::array<std::string, 30>
    initial_value: 'std::array<std::string, 30>{}'
  - id: clim_btn_state
    type: std::array<std::string, 30>
    initial_value: 'std::array<std::string, 30>{}'
  # Glyph mapped from the entity's `icon` attribute (nullptr = none / unmapped;
  # the domain's default icon is used then).
  - id: clim_btn_icon_attr
    type: std::array<const char *, 30>
    initial_value: 'std::array<const char *, 30>{}'


