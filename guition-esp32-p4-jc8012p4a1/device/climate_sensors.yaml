# =============================================================================
# CLIMATE — thermostat + button subscriptions and HA actions
# =============================================================================
# Data side of the climate view (device/climate_view.yaml):
#
#   climate_entity_select_0..3   — up to 4 climate.* entities, one card each
#   climate_switch_select_C_N    — up to 3 switch.* / input_boolean.* toggles
#                                  shown under card C's target row
#                                  (slot C * 3 + N in the clim_sw_* arrays)
#   climate_button_select_0..5   — up to 6 entities for the optional button row
#                                  (button, scene, script, light, switch, ...)
#
# All are NVS-persisted internal text entities edited on the device settings
# page (device/web_settings.yaml); the climate_entity_1..4,
# climate_entity_C_switch_N and climate_button_1..6 substitutions only seed
# them on first boot.
#
# Per thermostat the panel subscribes to the state (hvac mode) and the
# attributes friendly_name, current_temperature, temperature,
# target_temp_low/high, target_temp_step, min_temp, max_temp, hvac_action and
# preset_mode (shown in the status line only). HA forwards attributes as
# str(value): numbers arrive as "21.5" and a missing value as "None".
#
# Taps call HA actions over the native API (homeassistant.action), like the
# music controls, so they need "Allow the device to perform Home Assistant
# actions" enabled on the device in HA. The +/− buttons only move a pending
# target locally; climate_pending_tick sends one set_temperature once the taps
# stop (CLIM_SEND_DELAY_MS), instead of one action per tap.
# =============================================================================

substitutions:
  climate_entity_1: ""
  climate_entity_2: ""
  climate_entity_3: ""
  climate_entity_4: ""
  climate_entity_1_switch_1: ""
  climate_entity_1_switch_2: ""
  climate_entity_1_switch_3: ""
  climate_entity_2_switch_1: ""
  climate_entity_2_switch_2: ""
  climate_entity_2_switch_3: ""
  climate_entity_3_switch_1: ""
  climate_entity_3_switch_2: ""
  climate_entity_3_switch_3: ""
  climate_entity_4_switch_1: ""
  climate_entity_4_switch_2: ""
  climate_entity_4_switch_3: ""
  climate_button_1: ""
  climate_button_2: ""
  climate_button_3: ""
  climate_button_4: ""
  climate_button_5: ""
  climate_button_6: ""


globals:
  # ---- Thermostats (4 slots) ------------------------------------------------
  # Validated entity per slot ("" = slot unused). Set even before the API is up,
  # so the view can lay itself out from it.
  - id: clim_entity
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'
  # Entity registered with the API's state-subscription list, per slot. ESPHome
  # has no unsubscribe (see weather_sensors.yaml), so a reconnect must not
  # subscribe again; the generation counter invalidates callbacks of an entity
  # that was replaced.
  - id: clim_subbed
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'
  - id: clim_gen
    type: std::array<int, 4>
    initial_value: '{0,0,0,0}'

  - id: clim_name
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'
  # Entity state = hvac mode ("off", "heat", ...) or "unavailable".
  - id: clim_state
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'
  - id: clim_action
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'
  - id: clim_preset
    type: std::array<std::string, 4>
    initial_value: '{"","","",""}'

  # Numeric attributes; NAN = not reported (or "None").
  - id: clim_cur
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_target
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_low
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_high
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_step
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_min
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_max
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'

  # Target set with +/− but not yet confirmed by HA (NAN = none). Sent once no
  # tap has come for CLIM_SEND_DELAY_MS; dropped when HA reports the new
  # target, or after CLIM_PENDING_TIMEOUT_MS if it never does (rejected call).
  - id: clim_pending
    type: std::array<float, 4>
    initial_value: 'std::array<float, 4>{NAN, NAN, NAN, NAN}'
  - id: clim_pending_ms
    type: std::array<uint32_t, 4>
    initial_value: '{0,0,0,0}'
  - id: clim_pending_sent
    type: std::array<bool, 4>
    initial_value: '{false,false,false,false}'

  # ---- Per-card switch rows (12 slots = card * 3 + n) -------------------------
  - id: clim_sw_entity
    type: std::array<std::string, 12>
    initial_value: 'std::array<std::string, 12>{}'
  - id: clim_sw_subbed
    type: std::array<std::string, 12>
    initial_value: 'std::array<std::string, 12>{}'
  - id: clim_sw_gen
    type: std::array<int, 12>
    initial_value: 'std::array<int, 12>{}'
  - id: clim_sw_name
    type: std::array<std::string, 12>
    initial_value: 'std::array<std::string, 12>{}'
  - id: clim_sw_state
    type: std::array<std::string, 12>
    initial_value: 'std::array<std::string, 12>{}'

  # ---- Button row (6 slots) -------------------------------------------------
  - id: clim_btn_entity
    type: std::array<std::string, 6>
    initial_value: '{"","","","","",""}'
  - id: clim_btn_subbed
    type: std::array<std::string, 6>
    initial_value: '{"","","","","",""}'
  - id: clim_btn_gen
    type: std::array<int, 6>
    initial_value: '{0,0,0,0,0,0}'
  - id: clim_btn_name
    type: std::array<std::string, 6>
    initial_value: '{"","","","","",""}'
  - id: clim_btn_state
    type: std::array<std::string, 6>
    initial_value: '{"","","","","",""}'
  # Glyph mapped from the entity's `icon` attribute (nullptr = none / unmapped;
  # the domain's default icon is used then).
  - id: clim_btn_icon_attr
    type: std::array<const char *, 6>
    initial_value: 'std::array<const char *, 6>{}'


