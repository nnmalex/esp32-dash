script:
  # ---------------------------------------------------------------------------
  # subscribe_climate: (re)binds thermostat slot N to its configured entity.
  # ---------------------------------------------------------------------------
  - id: subscribe_climate
    parameters:
      slot: int
    mode: restart
    then:
      - lambda: |-
          if (slot < 0 || slot >= 8) return;
          esphome::text::Text *const sel[8] = {
            &id(climate_entity_select_0), &id(climate_entity_select_1),
            &id(climate_entity_select_2), &id(climate_entity_select_3),
            &id(climate_entity_select_4), &id(climate_entity_select_5),
            &id(climate_entity_select_6), &id(climate_entity_select_7),
          };
          std::string entity = sel[slot]->state;
          if (!entity.empty() && entity.rfind("climate.", 0) != 0) {
            ESP_LOGW("climate", "Thermostat %d: '%s' must start with 'climate.'", slot + 1, entity.c_str());
            entity.clear();
          }

          // New entity: forget everything known about the previous one.
          if (entity != id(clim_entity)[slot]) {
            id(clim_entity)[slot] = entity;
            id(clim_name)[slot] = "";
            id(clim_state)[slot] = "";
            id(clim_action)[slot] = "";
            id(clim_preset)[slot] = "";
            id(clim_last_on_mode)[slot] = "";
            id(clim_cur)[slot] = NAN;
            id(clim_target)[slot] = NAN;
            id(clim_low)[slot] = NAN;
            id(clim_high)[slot] = NAN;
            id(clim_step)[slot] = NAN;
            id(clim_min)[slot] = NAN;
            id(clim_max)[slot] = NAN;
            id(clim_modes)[slot].clear();
            id(clim_has_off)[slot] = false;
            id(clim_presets)[slot].clear();
            id(clim_pending)[slot] = NAN;
            id(clim_pending_sent)[slot] = false;
            // Which cards show, and their size, depend on how many are set.
            id(layout_climate_page).execute();
          }
          id(render_climate_card).execute(slot);

          if (entity.empty()) {
            id(clim_subbed)[slot] = "";
            id(clim_gen)[slot] += 1;  // silence the old entity's callbacks
            return;
          }
          if (esphome::api::global_api_server == nullptr) return;
          // Already registered (e.g. HA reconnect): the API re-sends the
          // existing subscription list to the new client itself.
          if (entity == id(clim_subbed)[slot]) return;
          id(clim_subbed)[slot] = entity;

          id(clim_gen)[slot] += 1;
          const int gen = id(clim_gen)[slot];
          int *gen_ptr = &id(clim_gen)[slot];
          auto *api = esphome::api::global_api_server;
          using str_cb = std::function<void(const std::string &)>;
          using setter = std::function<void(int, const std::string &)>;

          // Every attribute callback stores its value and re-renders the card.
          auto sub = [&](const char *attr, setter fn) {
            api->subscribe_home_assistant_state(entity,
                attr == nullptr ? esphome::optional<std::string>()
                                : esphome::optional<std::string>(attr),
                str_cb([gen, gen_ptr, slot, fn](const std::string &v) {
                  if (gen != *gen_ptr) return;
                  fn(slot, v);
                  id(render_climate_card).execute(slot);
                }));
          };
          // "21.5" → 21.5; "None", "unavailable", "" → NAN
          auto num = [](const std::string &s) -> float {
            char *end = nullptr;
            float f = strtof(s.c_str(), &end);
            return end == s.c_str() ? NAN : f;
          };
          // Python list repr → the quoted tokens. Handles both plain strings
          // "['eco', 'boost']" and enum reprs "[<HVACMode.OFF: 'off'>, ...]".
          auto parse_list = [](const std::string &s) {
            std::vector<std::string> out;
            size_t i = 0;
            while (i < s.size()) {
              char q = s[i];
              if (q == '\'' || q == '"') {
                size_t j = s.find(q, i + 1);
                if (j == std::string::npos) break;
                out.push_back(s.substr(i + 1, j - i - 1));
                i = j + 1;
              } else {
                i++;
              }
            }
            return out;
          };

          sub(nullptr, [](int n, const std::string &v) {
            id(clim_state)[n] = v;
            if (!v.empty() && v != "off" && v != "unavailable" && v != "unknown")
              id(clim_last_on_mode)[n] = v;
          });
          sub("friendly_name", [](int n, const std::string &v) { id(clim_name)[n] = v; });
          sub("current_temperature", [num](int n, const std::string &v) { id(clim_cur)[n] = num(v); });
          sub("temperature", [num](int n, const std::string &v) {
            id(clim_target)[n] = num(v);
            // HA confirmed a target: the pending one is no longer needed.
            if (id(clim_pending_sent)[n]) {
              id(clim_pending)[n] = NAN;
              id(clim_pending_sent)[n] = false;
            }
          });
          sub("target_temp_low", [num](int n, const std::string &v) { id(clim_low)[n] = num(v); });
          sub("target_temp_high", [num](int n, const std::string &v) { id(clim_high)[n] = num(v); });
          sub("target_temp_step", [num](int n, const std::string &v) { id(clim_step)[n] = num(v); });
          sub("min_temp", [num](int n, const std::string &v) { id(clim_min)[n] = num(v); });
          sub("max_temp", [num](int n, const std::string &v) { id(clim_max)[n] = num(v); });
          sub("hvac_action", [](int n, const std::string &v) {
            id(clim_action)[n] = (v == "None") ? "" : v;
          });
          sub("hvac_modes", [parse_list](int n, const std::string &v) {
            id(clim_modes)[n].clear();
            id(clim_has_off)[n] = false;
            for (auto &m : parse_list(v)) {
              if (m == "off") id(clim_has_off)[n] = true;
              else id(clim_modes)[n].push_back(m);
            }
          });
          sub("preset_mode", [](int n, const std::string &v) {
            id(clim_preset)[n] = (v == "None") ? "" : v;
          });
          sub("preset_modes", [parse_list](int n, const std::string &v) {
            id(clim_presets)[n] = parse_list(v);
          });

          ESP_LOGI("climate", "Thermostat %d: subscribed to '%s'", slot + 1, entity.c_str());

  # ---------------------------------------------------------------------------
  # subscribe_climate_button: (re)binds button slot N to its entity.
  # ---------------------------------------------------------------------------
  - id: subscribe_climate_button
    parameters:
      slot: int
    mode: restart
    then:
      - lambda: |-
          if (slot < 0 || slot >= 30) return;
          // 0..5 bottom row, 6 + T*3 + J button J of thermostat T.
          esphome::text::Text *const sel[30] = {
            &id(climate_button_select_0), &id(climate_button_select_1), &id(climate_button_select_2),
            &id(climate_button_select_3), &id(climate_button_select_4), &id(climate_button_select_5),
            &id(climate_card_button_select_0_0), &id(climate_card_button_select_0_1), &id(climate_card_button_select_0_2),
            &id(climate_card_button_select_1_0), &id(climate_card_button_select_1_1), &id(climate_card_button_select_1_2),
            &id(climate_card_button_select_2_0), &id(climate_card_button_select_2_1), &id(climate_card_button_select_2_2),
            &id(climate_card_button_select_3_0), &id(climate_card_button_select_3_1), &id(climate_card_button_select_3_2),
            &id(climate_card_button_select_4_0), &id(climate_card_button_select_4_1), &id(climate_card_button_select_4_2),
            &id(climate_card_button_select_5_0), &id(climate_card_button_select_5_1), &id(climate_card_button_select_5_2),
            &id(climate_card_button_select_6_0), &id(climate_card_button_select_6_1), &id(climate_card_button_select_6_2),
            &id(climate_card_button_select_7_0), &id(climate_card_button_select_7_1), &id(climate_card_button_select_7_2),
          };
          std::string entity = sel[slot]->state;
          if (!entity.empty() && entity.find('.') == std::string::npos) {
            ESP_LOGW("climate", "Button slot %d: '%s' is not an entity id", slot, entity.c_str());
            entity.clear();
          }

          if (entity != id(clim_btn_entity)[slot]) {
            id(clim_btn_entity)[slot] = entity;
            id(clim_btn_name)[slot] = "";
            id(clim_btn_state)[slot] = "";
            id(clim_btn_icon_attr)[slot] = nullptr;
            id(layout_climate_page).execute();
          }
          id(render_climate_button).execute(slot);

          if (entity.empty()) {
            id(clim_btn_subbed)[slot] = "";
            id(clim_btn_gen)[slot] += 1;
            return;
          }
          if (esphome::api::global_api_server == nullptr) return;
          if (entity == id(clim_btn_subbed)[slot]) return;
          id(clim_btn_subbed)[slot] = entity;

          id(clim_btn_gen)[slot] += 1;
          const int gen = id(clim_btn_gen)[slot];
          int *gen_ptr = &id(clim_btn_gen)[slot];
          auto *api = esphome::api::global_api_server;
          using str_cb = std::function<void(const std::string &)>;

          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>(),
              str_cb([gen, gen_ptr, slot](const std::string &v) {
                if (gen != *gen_ptr) return;
                id(clim_btn_state)[slot] = v;
                id(render_climate_button).execute(slot);
              }));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("friendly_name"),
              str_cb([gen, gen_ptr, slot](const std::string &v) {
                if (gen != *gen_ptr) return;
                id(clim_btn_name)[slot] = v;
                id(render_climate_button).execute(slot);
              }));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("icon"),
              str_cb([gen, gen_ptr, slot](const std::string &v) {
                if (gen != *gen_ptr) return;
                // mdi:* name → glyph compiled into icon_font (assets/icons.yaml).
                static const char *const map[][2] = {
                  {"mdi:lightbulb", "\U000F0335"},       {"mdi:lightbulb-outline", "\U000F0336"},
                  {"mdi:lightbulb-on", "\U000F06E8"},    {"mdi:lightbulb-off", "\U000F0E4F"},
                  {"mdi:lightbulb-group", "\U000F1253"}, {"mdi:ceiling-light", "\U000F0769"},
                  {"mdi:lamp", "\U000F06B5"},            {"mdi:floor-lamp", "\U000F08DD"},
                  {"mdi:led-strip-variant", "\U000F1051"},
                  {"mdi:fan", "\U000F0210"},             {"mdi:fan-off", "\U000F081D"},
                  {"mdi:power", "\U000F0425"},           {"mdi:power-off", "\U000F0902"},
                  {"mdi:power-plug", "\U000F06A5"},      {"mdi:power-socket-eu", "\U000F07E7"},
                  {"mdi:television", "\U000F0502"},      {"mdi:television-classic", "\U000F07F4"},
                  {"mdi:speaker", "\U000F04C3"},         {"mdi:music", "\U000F075A"},
                  {"mdi:movie", "\U000F0381"},           {"mdi:coffee", "\U000F0176"},
                  {"mdi:kettle", "\U000F05FA"},          {"mdi:robot-vacuum", "\U000F070D"},
                  {"mdi:robot", "\U000F06A9"},           {"mdi:washing-machine", "\U000F072A"},
                  {"mdi:dishwasher", "\U000F0AAC"},      {"mdi:garage", "\U000F06D9"},
                  {"mdi:garage-open", "\U000F06DA"},     {"mdi:gate", "\U000F0299"},
                  {"mdi:door", "\U000F081A"},            {"mdi:door-open", "\U000F081C"},
                  {"mdi:lock", "\U000F033E"},            {"mdi:lock-open", "\U000F033F"},
                  {"mdi:window-shutter", "\U000F111C"},  {"mdi:blinds", "\U000F00AC"},
                  {"mdi:palette", "\U000F03D8"},         {"mdi:script-text", "\U000F0BC2"},
                  {"mdi:gesture-tap-button", "\U000F12A8"}, {"mdi:gesture-tap", "\U000F0741"},
                  {"mdi:home", "\U000F02DC"},            {"mdi:home-export-outline", "\U000F0F9B"},
                  {"mdi:sleep", "\U000F04B2"},           {"mdi:weather-night", "\U000F0594"},
                  {"mdi:bell", "\U000F009A"},            {"mdi:alarm-light", "\U000F078F"},
                  {"mdi:water-boiler", "\U000F0F92"},    {"mdi:radiator", "\U000F0438"},
                  {"mdi:heat-wave", "\U000F1A45"},       {"mdi:fire", "\U000F0238"},
                  {"mdi:snowflake", "\U000F0717"},       {"mdi:thermostat", "\U000F0393"},
                  {"mdi:air-conditioner", "\U000F001B"}, {"mdi:air-purifier", "\U000F0D44"},
                  {"mdi:water", "\U000F058C"},           {"mdi:shower", "\U000F09A0"},
                  {"mdi:bed", "\U000F02E3"},             {"mdi:sofa", "\U000F04B9"},
                  {"mdi:silverware-fork-knife", "\U000F0A70"},
                  {"mdi:car", "\U000F010B"},             {"mdi:car-electric", "\U000F0B6C"},
                  {"mdi:toggle-switch-variant", "\U000F1A25"},
                  {"mdi:play-circle", "\U000F040C"},     {"mdi:check", "\U000F012C"},
                  {"mdi:rocket-launch", "\U000F14DE"},   {"mdi:leaf", "\U000F032A"},
                };
                const char *ic = nullptr;
                for (auto &m : map) if (v == m[0]) { ic = m[1]; break; }
                id(clim_btn_icon_attr)[slot] = ic;
                id(render_climate_button).execute(slot);
              }));

          ESP_LOGI("climate", "Button slot %d: subscribed to '%s'", slot, entity.c_str());

  # ---------------------------------------------------------------------------
  # Tap handlers (called from the LVGL event callbacks in climate_view.yaml)
  # ---------------------------------------------------------------------------

  # +/− : moves the pending target by one step; climate_pending_tick sends it.
  - id: climate_adjust_target
    parameters:
      slot: int
      dir: int
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          if (slot < 0 || slot >= 8 || id(clim_entity)[slot].empty()) return;
          float step = id(clim_step)[slot];
          float mx = id(clim_max)[slot], mn = id(clim_min)[slot];
          if (std::isnan(step) || step <= 0) step = (!std::isnan(mx) && mx > 50) ? 1.0f : 0.5f;
          float base = std::isnan(id(clim_pending)[slot]) ? id(clim_target)[slot] : id(clim_pending)[slot];
          if (std::isnan(base)) return;
          float v = roundf((base + dir * step) / step) * step;
          if (!std::isnan(mn) && v < mn) v = mn;
          if (!std::isnan(mx) && v > mx) v = mx;
          id(clim_pending)[slot] = v;
          id(clim_pending_ms)[slot] = millis();
          id(clim_pending_sent)[slot] = false;
          id(render_climate_card).execute(slot);

  # Mode row: idx 0 is the power button, 1.. are clim_modes[idx - 1].
  - id: climate_mode_pressed
    parameters:
      slot: int
      idx: int
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          if (slot < 0 || slot >= 8) return;
          const std::string &entity = id(clim_entity)[slot];
          if (entity.empty()) return;
          const auto &modes = id(clim_modes)[slot];
          std::string mode;
          if (idx == 0) {
            if (id(clim_state)[slot] != "off") {
              mode = "off";
            } else {
              // Back to the mode it was in, else the most usual "on" mode.
              mode = id(clim_last_on_mode)[slot];
              if (std::find(modes.begin(), modes.end(), mode) == modes.end()) mode.clear();
              for (const char *pref : {"heat", "heat_cool", "auto", "cool"}) {
                if (!mode.empty()) break;
                if (std::find(modes.begin(), modes.end(), pref) != modes.end()) mode = pref;
              }
              if (mode.empty() && !modes.empty()) mode = modes[0];
            }
          } else if (idx - 1 < (int) modes.size()) {
            mode = modes[idx - 1];
          }
          if (mode.empty() || mode == id(clim_state)[slot]) return;
          id(climate_set_hvac_mode).execute(entity, mode);

  - id: climate_preset_pressed
    parameters:
      slot: int
      idx: int
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          if (slot < 0 || slot >= 8) return;
          const std::string &entity = id(clim_entity)[slot];
          const auto &presets = id(clim_presets)[slot];
          if (entity.empty() || idx < 0 || idx >= (int) presets.size()) return;
          std::string preset = presets[idx];
          // Tapping the active preset turns it off again (back to "none"), when
          // the thermostat has one — so Boost works as a toggle.
          if (preset == id(clim_preset)[slot]) {
            if (std::find(presets.begin(), presets.end(), "none") == presets.end()) return;
            preset = "none";
          }
          id(climate_set_preset_mode).execute(entity, preset);

  # Bottom row and per-thermostat buttons: the action depends on the domain.
  - id: climate_button_pressed
    parameters:
      slot: int
    mode: queued
    max_runs: 10
    then:
      - lambda: |-
          if (slot < 0 || slot >= 30) return;
          const std::string &entity = id(clim_btn_entity)[slot];
          if (entity.empty()) return;
          std::string domain = entity.substr(0, entity.find('.'));
          std::string action;
          if (domain == "button" || domain == "input_button") action = domain + ".press";
          else if (domain == "scene" || domain == "script") action = domain + ".turn_on";
          else if (domain == "automation") action = "automation.trigger";
          else if (domain == "lock")
            action = id(clim_btn_state)[slot] == "locked" ? "lock.unlock" : "lock.lock";
          else if (domain == "cover") action = "cover.toggle";
          else action = "homeassistant.toggle";
          ESP_LOGI("climate", "Button slot %d: %s %s", slot, action.c_str(), entity.c_str());
          id(ha_entity_action).execute(action, entity);

  # ---------------------------------------------------------------------------
  # HA actions. Separate scripts because data keys cannot be templated.
  # on_error shows the "enable actions" prompt, as the music controls do.
  # ---------------------------------------------------------------------------
  - id: ha_entity_action
    parameters:
      action_name: string
      entity: string
    mode: queued
    max_runs: 10
    then:
      - homeassistant.action:
          action: !lambda 'return action_name;'
          data:
            entity_id: !lambda 'return entity;'
          on_error:
            - lambda: |-
                if (!id(actions_prompt_acked)) lv_obj_clear_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN);

  - id: climate_set_temperature
    parameters:
      entity: string
      value: float
    mode: queued
    max_runs: 10
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: !lambda 'return entity;'
            temperature: !lambda |-
              char buf[16];
              snprintf(buf, sizeof(buf), "%.2f", value);
              return std::string(buf);
          on_error:
            - lambda: |-
                if (!id(actions_prompt_acked)) lv_obj_clear_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN);

  - id: climate_set_hvac_mode
    parameters:
      entity: string
      mode: string
    mode: queued
    max_runs: 10
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: !lambda 'return entity;'
            hvac_mode: !lambda 'return mode;'
          on_error:
            - lambda: |-
                if (!id(actions_prompt_acked)) lv_obj_clear_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN);

  - id: climate_set_preset_mode
    parameters:
      entity: string
      preset: string
    mode: queued
    max_runs: 10
    then:
      - homeassistant.action:
          action: climate.set_preset_mode
          data:
            entity_id: !lambda 'return entity;'
            preset_mode: !lambda 'return preset;'
          on_error:
            - lambda: |-
                if (!id(actions_prompt_acked)) lv_obj_clear_flag(id(actions_prompt), LV_OBJ_FLAG_HIDDEN);

  # ---------------------------------------------------------------------------
  # climate_pending_tick: sends a settled +/− target, expires unconfirmed ones.
  # ---------------------------------------------------------------------------
  - id: climate_pending_tick
    mode: single
    then:
      - lambda: |-
          const uint32_t CLIM_SEND_DELAY_MS = 1200;
          const uint32_t CLIM_PENDING_TIMEOUT_MS = 10000;
          const uint32_t now = millis();
          for (int i = 0; i < 8; i++) {
            if (std::isnan(id(clim_pending)[i])) continue;
            uint32_t age = now - id(clim_pending_ms)[i];
            if (!id(clim_pending_sent)[i]) {
              if (age < CLIM_SEND_DELAY_MS) continue;
              // Nothing to send (no entity, or back at the current target —
              // HA would not report a change, so the pending value would
              // linger until the timeout).
              if (id(clim_entity)[i].empty()
                  || fabsf(id(clim_pending)[i] - id(clim_target)[i]) < 0.01f) {
                id(clim_pending)[i] = NAN;
                id(render_climate_card).execute(i);
                continue;
              }
              id(clim_pending_sent)[i] = true;
              id(clim_pending_ms)[i] = now;
              ESP_LOGI("climate", "Thermostat %d: set_temperature %.1f", i + 1, id(clim_pending)[i]);
              id(climate_set_temperature).execute(id(clim_entity)[i], id(clim_pending)[i]);
            } else if (age >= CLIM_PENDING_TIMEOUT_MS) {
              // HA never reported the new target: show the real one again.
              id(clim_pending)[i] = NAN;
              id(clim_pending_sent)[i] = false;
              id(render_climate_card).execute(i);
            }
          }


interval:
  - interval: 200ms
    then:
      - if:
          condition:
            lambda: |-
              for (float p : id(clim_pending)) if (!std::isnan(p)) return true;
              return false;
          then:
            - script.execute: climate_pending_tick


# Re-subscribe after HA reconnect (merged with the api block in device.yaml).
# Each call returns at once for a slot that is already registered.
api:
  on_client_connected:
    - lambda: |-
        for (int i = 0; i < 8; i++) id(subscribe_climate).execute(i);
        for (int i = 0; i < 30; i++) id(subscribe_climate_button).execute(i);
