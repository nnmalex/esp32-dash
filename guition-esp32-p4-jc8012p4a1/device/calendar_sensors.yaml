# =============================================================================
# CALENDAR SENSORS — HA subscription + REST fetch for up to three calendars
# =============================================================================
# Each slot subscribes to a calendar.* entity's attributes:
#   message    → event title
#   start_time → "YYYY-MM-DD HH:MM:SS" (or "YYYY-MM-DD" for all-day)
#   end_time   → "YYYY-MM-DD HH:MM:SS" (used to detect past events)
#   all_day    → "True"/"False"
#
# Those attributes only ever expose the *next* event per calendar, so they are
# used purely as a fallback for when no HA access token is configured.
#
# The primary data path is fetch_calendar_data: one batched REST call covering
# every configured calendar, into the shared cal_events_buf as pipe-delimited
# lines:
#   CAL_IDX|TITLE|START_ISO|END_ISO|ALLDAY\n
# Both consumers filter that single buffer by date:
#   render_calendar_grid (calendar_view.yaml) — the 5-day week grid
#   render_idle_agenda   (below)              — today + tomorrow on the idle page
#
# The window always spans the union of what both views need, so one fetch feeds
# both. http_request is synchronous, so the request blocks the main loop (and
# therefore LVGL) — hence one batched call rather than one per calendar, and
# hence maybe_fetch_calendar for anything triggered by a UI interaction.
#
# Subscriptions follow the generation-counter pattern from media_player_select
# and are registered once per entity — see cal_subbed below.
# =============================================================================

substitutions:
  calendar_entity_1: ""
  calendar_entity_2: ""
  calendar_entity_3: ""


# -----------------------------------------------------------------------------
# Raw attribute storage — updated by subscription callbacks before label render
# -----------------------------------------------------------------------------
globals:
  - id: cal_title_0
    type: std::string
    initial_value: '""'
  - id: cal_start_0
    type: std::string
    initial_value: '""'
  - id: cal_end_0
    type: std::string
    initial_value: '""'
  - id: cal_all_day_0
    type: std::string
    initial_value: '""'

  - id: cal_title_1
    type: std::string
    initial_value: '""'
  - id: cal_start_1
    type: std::string
    initial_value: '""'
  - id: cal_end_1
    type: std::string
    initial_value: '""'
  - id: cal_all_day_1
    type: std::string
    initial_value: '""'

  - id: cal_title_2
    type: std::string
    initial_value: '""'
  - id: cal_start_2
    type: std::string
    initial_value: '""'
  - id: cal_end_2
    type: std::string
    initial_value: '""'
  - id: cal_all_day_2
    type: std::string
    initial_value: '""'

  - id: cal_sub_gen_0
    type: int
    initial_value: '0'
  - id: cal_sub_gen_1
    type: int
    initial_value: '0'
  - id: cal_sub_gen_2
    type: int
    initial_value: '0'

  # Entity currently registered with the API state-subscription list, per slot.
  # ESPHome has no unsubscribe (see weather_sensors.yaml for the full rationale),
  # so re-running subscribe_calendar on every reconnect would leak callbacks.
  - id: cal_subbed
    type: std::array<std::string, 3>
    initial_value: '{"","",""}'

  # Shared HTTP fetch buffer — consumed by both render_calendar_grid and
  # render_idle_agenda.
  - id: cal_events_buf
    type: std::string
    initial_value: '""'
  - id: cal_fetch_start   # "YYYY-MM-DDTHH:MM:SS" for the API query start
    type: std::string
    initial_value: '""'
  - id: cal_fetch_end
    type: std::string
    initial_value: '""'

  # millis() of the last successful fetch. Interactive callers (navbar) use this
  # to skip a blocking refetch when the cache is still warm. Unsigned wraparound
  # at ~49 days is handled correctly by the subtraction.
  - id: cal_last_fetch_ms
    type: uint32_t
    initial_value: '0'


# -----------------------------------------------------------------------------
# Entity selector text entities (NVS-persisted, visible in device settings)
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Calendar 1 Entity"
    id: calendar_entity_select_0
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_1}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 0}

  - platform: template
    name: "Calendar 2 Entity"
    id: calendar_entity_select_1
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_2}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 1}

  - platform: template
    name: "Calendar 3 Entity"
    id: calendar_entity_select_2
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_3}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 2}


# -----------------------------------------------------------------------------
# How long ended events stay (greyed out) on the idle agenda.
# -----------------------------------------------------------------------------
number:
  - platform: template
    name: "Agenda: Past Event Lookback"
    id: agenda_lookback
    entity_category: config
    icon: "mdi:history"
    min_value: 0
    max_value: 720
    step: 15
    initial_value: 120
    unit_of_measurement: "min"
    optimistic: true
    restore_value: true
    set_action:
      # set_action runs before the value is stored; publish so the script sees it
      - lambda: 'id(agenda_lookback)->publish_state(x);'
      - script.execute: render_idle_agenda


# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:

  # ---------------------------------------------------------------------------
  # render_idle_agenda
  # ---------------------------------------------------------------------------
  # Populates idle_agenda_slot_0..4 from cal_events_buf with events that fall on
  # today or tomorrow — including ones that began earlier and are still running,
  # and multi-day all-day events. Timed events that have ended are greyed out
  # and drop off once they are older than the "Agenda: Past Event Lookback"
  # setting. Items are grouped under TODAY / TOMORROW headings. Falls back to the per-calendar subscription globals when the
  # buffer is empty (no ha_token configured).
  # ---------------------------------------------------------------------------
  - id: render_idle_agenda
    mode: single
    then:
      - lambda: |-
          auto now_time = id(ha_time).now();
          if (!now_time.is_valid()) return;
          namespace cj = esp32_dash::calendar_json;

          // Day boundaries as "YYYY-MM-DD" (DST-safe, see calendar_json.h).
          char today_str[11], tomorrow_str[11], after_str[11];
          cj::local_date(now_time.timestamp, 0, today_str);
          cj::local_date(now_time.timestamp, 1, tomorrow_str);
          cj::local_date(now_time.timestamp, 2, after_str);

          // Timed events that ended within the look-back stay on the agenda,
          // greyed out; older ones drop off so they stop crowding out what is
          // coming up. Yesterday's events never show, even inside the window.
          char now_dt[20], cutoff_dt[20], today_start[20], after_start[20];
          cj::local_datetime(now_time.timestamp, now_dt);
          cj::local_datetime(now_time.timestamp - (time_t) id(agenda_lookback).state * 60, cutoff_dt);
          snprintf(today_start, sizeof(today_start), "%s 00:00:00", today_str);
          snprintf(after_start, sizeof(after_start), "%s 00:00:00", after_str);
          const char *floor_dt = strcmp(cutoff_dt, today_start) > 0 ? cutoff_dt : today_start;

          // Calendar accent colors (matching calendar page slots)
          const uint32_t CAL_COLORS[3] = {0x4A90E2, 0x5BA55A, 0xE2914A};

          // Only the 5 soonest events are ever shown, so cap collection at 12 to
          // keep this lambda's stack frame small (it runs on the main loop task).
          const int MAX_ITEMS = 12;

          struct AgendaItem {
            char sort_key[20];    // "YYYY-MM-DD HH:MM:SS\0" — when it sorts on the agenda
            char title[64];
            char time_label[48];  // "12:00–13:00", "All Day", "until 15:30"
            uint32_t accent_color;
            bool is_past;
            bool tomorrow;        // which section heading it sits under
          };

          AgendaItem items[MAX_ITEMS];
          int item_count = 0;
          memset(items, 0, sizeof(items));

          // Adds one event if any part of it falls on today or tomorrow.
          auto add_item = [&](
              const char *title_c,
              std::string start,   // mutable copies — we normalize T→space
              std::string end_s,
              bool is_allday,
              int cal_idx) {

            if (!title_c || title_c[0] == '\0') return;
            if (start.length() < 10) return;
            if (item_count >= MAX_ITEMS) return;
            if (start.length() >= 11 && start[10] == 'T') start[10] = ' ';
            if (end_s.length() >= 11 && end_s[10] == 'T') end_s[10] = ' ';

            char time_buf[48];
            char key[20];
            bool is_past = false;
            bool tomorrow = false;

            if (is_allday) {
              // Dates only; the end date is exclusive. No end means one day.
              std::string sd = start.substr(0, 10);
              std::string ed = end_s.length() >= 10 ? end_s.substr(0, 10) : std::string();
              auto covers = [&](const char *day) {
                return sd <= day && (ed.empty() ? sd == day : ed > day);
              };
              bool on_today = covers(today_str);
              if (!on_today && !covers(tomorrow_str)) return;
              const char *day = on_today ? today_str : tomorrow_str;
              tomorrow = !on_today;
              snprintf(time_buf, sizeof(time_buf), "All Day");
              // A multi-day event sorts under the day it is shown for, not the
              // day it began.
              snprintf(key, sizeof(key), "%s 00:00:00", day);
            } else {
              if (start.length() < 16) return;
              bool has_end = end_s.length() >= 16;
              const std::string &end_cmp = has_end ? end_s : start;
              // Keep events overlapping [floor, start of the day after tomorrow).
              if (start.compare(0, 19, after_start) >= 0) return;
              if (end_cmp.compare(0, 19, floor_dt) <= 0) return;
              is_past = end_cmp.compare(0, 19, now_dt) <= 0;

              int sh = atoi(start.c_str() + 11), smin = atoi(start.c_str() + 14);
              int eh = atoi(end_cmp.c_str() + 11), emin = atoi(end_cmp.c_str() + 14);
              if (start.compare(0, 10, today_str) < 0) {
                // Already running when today began.
                if (end_cmp.compare(0, 10, today_str) == 0)
                  snprintf(time_buf, sizeof(time_buf), "until %02d:%02d", eh, emin);
                else
                  snprintf(time_buf, sizeof(time_buf), "Ongoing");
                snprintf(key, sizeof(key), "%s", today_start);
              } else {
                tomorrow = start.compare(0, 10, tomorrow_str) == 0;
                if (has_end)
                  snprintf(time_buf, sizeof(time_buf), "%02d:%02d\xe2\x80\x93%02d:%02d", sh, smin, eh, emin);
                else
                  snprintf(time_buf, sizeof(time_buf), "%02d:%02d", sh, smin);
                snprintf(key, sizeof(key), "%.19s", start.c_str());
              }
            }

            AgendaItem &item = items[item_count++];
            strncpy(item.sort_key,   key,      sizeof(item.sort_key)   - 1);
            strncpy(item.title,      title_c,  sizeof(item.title)      - 1);
            strncpy(item.time_label, time_buf, sizeof(item.time_label) - 1);
            item.accent_color = (cal_idx >= 0 && cal_idx < 3) ? CAL_COLORS[cal_idx] : 0x888888U;
            item.is_past = is_past;
            item.tomorrow = tomorrow;
          };

          if (!id(cal_events_buf).empty()) {
            // --- Primary path: parse the shared HTTP-fetched buffer ---
            // Format: "CAL_IDX|TITLE|START|END|ALLDAY\n" (repeated)
            const std::string &buf = id(cal_events_buf);
            size_t pos = 0;
            while (pos < buf.size() && item_count < MAX_ITEMS) {
              size_t nl = buf.find('\n', pos);
              if (nl == std::string::npos) nl = buf.size();
              if (nl > pos) {
                std::string line = buf.substr(pos, nl - pos);
                // Parse pipe-delimited fields
                size_t p1 = line.find('|');
                size_t p2 = (p1 != std::string::npos) ? line.find('|', p1 + 1) : std::string::npos;
                size_t p3 = (p2 != std::string::npos) ? line.find('|', p2 + 1) : std::string::npos;
                size_t p4 = (p3 != std::string::npos) ? line.find('|', p3 + 1) : std::string::npos;
                if (p4 != std::string::npos) {
                  int cal_idx      = atoi(line.c_str());
                  std::string title = line.substr(p1 + 1, p2 - p1 - 1);
                  std::string start = line.substr(p2 + 1, p3 - p2 - 1);
                  std::string end_s = line.substr(p3 + 1, p4 - p3 - 1);
                  bool is_allday   = (line.substr(p4 + 1) == "1");
                  add_item(title.c_str(), start, end_s, is_allday, cal_idx);
                }
              }
              pos = nl + 1;
            }
          } else {
            // --- Fallback path: subscription globals (one event per calendar) ---
            // Used when ha_token is not configured and no fetch has run.
            auto add_sub = [&](
                const std::string &title,
                const std::string &start,
                const std::string &end_s,
                const std::string &all_day_s,
                int cal_idx) {
              bool is_allday = (all_day_s == "True" || all_day_s == "true" || all_day_s == "1");
              add_item(title.c_str(), start, end_s, is_allday, cal_idx);
            };
            add_sub(id(cal_title_0), id(cal_start_0), id(cal_end_0), id(cal_all_day_0), 0);
            add_sub(id(cal_title_1), id(cal_start_1), id(cal_end_1), id(cal_all_day_1), 1);
            add_sub(id(cal_title_2), id(cal_start_2), id(cal_end_2), id(cal_all_day_2), 2);
          }

          // Partial selection sort — only the first 5 entries are displayed, so
          // stop once those are in place instead of ordering the whole array.
          int sort_n = item_count < 5 ? item_count : 5;
          for (int i = 0; i < sort_n; i++) {
            int best = i;
            for (int j = i + 1; j < item_count; j++) {
              if (strcmp(items[j].sort_key, items[best].sort_key) < 0) best = j;
            }
            if (best != i) {
              AgendaItem tmp = items[i];
              items[i] = items[best];
              items[best] = tmp;
            }
          }

          // Widget pointer arrays for agenda slots 0..4
          lv_obj_t *slot_objs[] = {
            id(idle_agenda_slot_0), id(idle_agenda_slot_1), id(idle_agenda_slot_2),
            id(idle_agenda_slot_3), id(idle_agenda_slot_4)
          };
          lv_obj_t *accent_objs[] = {
            id(idle_agenda_accent_0), id(idle_agenda_accent_1), id(idle_agenda_accent_2),
            id(idle_agenda_accent_3), id(idle_agenda_accent_4)
          };
          lv_obj_t *time_labels[] = {
            id(idle_agenda_time_0), id(idle_agenda_time_1), id(idle_agenda_time_2),
            id(idle_agenda_time_3), id(idle_agenda_time_4)
          };
          lv_obj_t *title_labels[] = {
            id(idle_agenda_title_0), id(idle_agenda_title_1), id(idle_agenda_title_2),
            id(idle_agenda_title_3), id(idle_agenda_title_4)
          };

          // Lay the list out top-down under "TODAY" / "TOMORROW" headings,
          // stopping at whatever no longer fits above the nav bar (y = 740).
          lv_obj_t *hdrs[2] = { id(idle_agenda_hdr_today), id(idle_agenda_hdr_tomorrow) };
          const int TOP = 14, HDR_H = 48, SLOT_H = 115, BOTTOM = 740;
          lv_obj_add_flag(hdrs[0], LV_OBJ_FLAG_HIDDEN);
          lv_obj_add_flag(hdrs[1], LV_OBJ_FLAG_HIDDEN);

          // Empty state — only once there is something to be empty of: a
          // configured calendar, and either fetched data or no token to fetch
          // with (so a blank pane during the first fetch is not mislabelled).
          bool any_cal = false;
          for (auto *sel : {id(calendar_entity_select_0), id(calendar_entity_select_1),
                            id(calendar_entity_select_2)})
            if (sel->state.rfind("calendar.", 0) == 0) any_cal = true;
          bool loaded = id(cal_last_fetch_ms) != 0 || id(ha_token_global).empty();
          bool empty = item_count == 0 && any_cal && loaded;
          if (empty) {
            lv_obj_set_y(hdrs[0], TOP);
            lv_obj_clear_flag(hdrs[0], LV_OBJ_FLAG_HIDDEN);
            lv_obj_set_y(id(idle_agenda_empty), TOP + HDR_H + 12);
            lv_obj_clear_flag(id(idle_agenda_empty), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(idle_agenda_empty), LV_OBJ_FLAG_HIDDEN);
          }

          int y = TOP, shown = 0, section = -1;
          for (int i = 0; i < item_count && shown < 5; i++) {
            const AgendaItem &item = items[i];
            int day = item.tomorrow ? 1 : 0;
            if (day != section) {
              if (y + HDR_H + SLOT_H > BOTTOM) break;
              lv_obj_set_y(hdrs[day], y);
              lv_obj_clear_flag(hdrs[day], LV_OBJ_FLAG_HIDDEN);
              y += HDR_H;
              section = day;
            }
            if (y + SLOT_H > BOTTOM) break;

            uint32_t accent_col = item.is_past ? 0x444444U : item.accent_color;
            uint32_t time_col   = item.is_past ? 0x444444U : item.accent_color;
            uint32_t title_col  = item.is_past ? 0x555555U : 0xDDDDDDU;

            lv_obj_set_y(slot_objs[shown], y);
            lv_obj_set_style_bg_color(accent_objs[shown], lv_color_hex(accent_col), 0);
            lv_obj_set_style_text_color(time_labels[shown], lv_color_hex(time_col), 0);
            lv_obj_set_style_text_color(title_labels[shown], lv_color_hex(title_col), 0);
            lv_label_set_text(time_labels[shown], item.time_label);
            lv_label_set_text(title_labels[shown], item.title);
            lv_obj_clear_flag(slot_objs[shown], LV_OBJ_FLAG_HIDDEN);
            y += SLOT_H;
            shown++;
          }
          for (int i = shown; i < 5; i++) lv_obj_add_flag(slot_objs[i], LV_OBJ_FLAG_HIDDEN);

  # ---------------------------------------------------------------------------
  # maybe_fetch_calendar
  # ---------------------------------------------------------------------------
  # The interactive entry point. Two things matter here:
  #   - the delay lets the page transition finish drawing before the blocking
  #     fetch stalls the loop, so the stall lands on a settled screen;
  #   - mode: restart means a flurry of navbar taps coalesces into one fetch.
  # Callers render from cache first and come here for the refresh.
  # ---------------------------------------------------------------------------
  - id: maybe_fetch_calendar
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: |-
              return id(cal_events_buf).empty()
                  || (millis() - id(cal_last_fetch_ms)) > 300000;
          then:
            - script.execute: fetch_calendar_data

  # ---------------------------------------------------------------------------
  # fetch_calendar_data
  # ---------------------------------------------------------------------------
  # ONE batched request covering every configured calendar:
  #   POST /api/services/calendar/get_events?return_response=true
  #   {"entity_id": [...], "start_date_time": ..., "end_date_time": ...}
  # HA resolves all three server-side, so the device pays one connect and one
  # round trip instead of three. Requires HA 2024.2 or newer.
  #
  # HA rejects the whole call if any one entity_id is unknown, which would take
  # all three calendars down together — so a failed batch falls back to the old
  # per-entity GET /api/calendars/<entity> loop, where a bad entity only costs
  # its own slot.
  #
  # The window spans the union of what the week grid (5 columns from
  # cal_view_offset) and the idle agenda (today + tomorrow) need, so a single
  # fetch serves both.
  #
  # http_request is synchronous: this blocks the main loop for the duration.
  # Interactive callers should go through maybe_fetch_calendar, not here.
  # ---------------------------------------------------------------------------
  - id: fetch_calendar_data
    mode: restart
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("cal_fetch", "Time not valid, skipping fetch");
            return;
          }
          if (id(ha_token_global).empty()) {
            ESP_LOGW("cal_fetch", "ha_token not set — skipping fetch");
            return;
          }

          // Fixed window covering every view this data can feed:
          //   week grid   — 5 columns from cal_view_offset, which is clamped to
          //                 -1..+2, so days -1 through +6 are reachable
          //   idle agenda — today and tomorrow
          // Fetching the full span once means changing cal_view_offset only needs
          // a re-render, never another blocking round of HTTP requests.
          const int DAY_FROM = -1;
          const int DAY_TO   = 7;   // exclusive

          char d0[11], d1[11];
          esp32_dash::calendar_json::local_date(t.timestamp, DAY_FROM, d0);
          esp32_dash::calendar_json::local_date(t.timestamp, DAY_TO, d1);
          char s[21], e[21];
          snprintf(s, sizeof(s), "%sT00:00:00", d0);
          snprintf(e, sizeof(e), "%sT00:00:00", d1);

          id(cal_fetch_start) = std::string(s);
          id(cal_fetch_end)   = std::string(e);
          ESP_LOGI("cal_fetch", "Window %s .. %s", s, e);

          esphome::text::Text *sel[3] = {
            id(calendar_entity_select_0),
            id(calendar_entity_select_1),
            id(calendar_entity_select_2)
          };

          // Slot index must survive into cal_events_buf (it picks the accent
          // colour), so keep entities in a slot-indexed array rather than a
          // compacted list.
          std::string entities[3];
          std::string id_list;
          int n_ent = 0;
          for (int i = 0; i < 3; i++) {
            std::string e = sel[i]->state;
            if (e.rfind("calendar.", 0) != 0) continue;
            entities[i] = e;
            if (!id_list.empty()) id_list += ", ";
            id_list += "\"" + e + "\"";
            n_ent++;
          }
          if (n_ent == 0) {
            ESP_LOGI("cal_fetch", "No calendar entities configured — skipping fetch");
            return;
          }

          std::string auth = "Bearer " + id(ha_token_global);
          std::string new_buf;
          int total = 0;
          bool any_ok = false;
          uint32_t http_ms = 0;

          // Drain a response body in 4 KB chunks (matching buffer_size_rx) off
          // the heap — a 4 KB frame would be a large bite out of the loop task's
          // stack. content_length lets us size the string in one allocation.
          auto drain = [&](std::shared_ptr<esphome::http_request::HttpContainer> c,
                           std::string &out) {
            out.reserve(c->content_length > 0 ? (size_t) c->content_length + 1 : 16384u);
            std::vector<uint8_t> chunk(4096);
            int n;
            while ((n = c->read(chunk.data(), chunk.size())) > 0)
              out.append(reinterpret_cast<char *>(chunk.data()), n);
            http_ms += c->duration_ms;
            c->end();
          };

          // --- Primary path: one batched service call for all calendars ---
          {
            std::string url = id(ha_base_url) +
                              "/api/services/calendar/get_events?return_response=true";
            std::string req = "{\"entity_id\": [" + id_list +
                              "], \"start_date_time\": \"" + id(cal_fetch_start) +
                              "\", \"end_date_time\": \"" + id(cal_fetch_end) + "\"}";

            std::vector<esphome::http_request::Header> hdrs;
            hdrs.push_back({"Authorization", auth});
            hdrs.push_back({"Content-Type", "application/json"});

            auto c = id(http_req)->post(url, req, hdrs);
            if (c && c->status_code == 200) {
              std::string resp;
              drain(c, resp);

              // {"changed_states": [], "service_response": {"calendar.x": {"events": [...]}}}
              std::string svc;
              int sections = 0;
              if (esp32_dash::calendar_json::extract_object_field(resp, "service_response", svc)) {
                for (int i = 0; i < 3; i++) {
                  if (entities[i].empty()) continue;
                  std::string ent_obj, events_arr;
                  if (!esp32_dash::calendar_json::extract_object_field(
                          svc, entities[i].c_str(), ent_obj)) {
                    ESP_LOGW("cal_fetch", "No response section for %s", entities[i].c_str());
                    continue;
                  }
                  sections++;
                  if (!esp32_dash::calendar_json::extract_array_field(ent_obj, "events", events_arr))
                    continue;
                  total += esp32_dash::calendar_json::append_calendar_events(events_arr, i, new_buf);
                }
              }
              // Nothing recognisable in the response — fall through to the
              // per-calendar path rather than blanking both views.
              any_ok = (sections > 0);
              if (!any_ok)
                ESP_LOGW("cal_fetch", "Unrecognised get_events response — falling back");
            } else {
              ESP_LOGW("cal_fetch", "Batched get_events HTTP %d — falling back to per-calendar GET",
                       c ? c->status_code : -1);
              if (c) { http_ms += c->duration_ms; c->end(); }
            }
          }

          // --- Fallback: one GET per calendar (pre-2024.2 HA, or a bad entity
          //     id that made HA reject the whole batch) ---
          if (!any_ok) {
            new_buf.clear();
            total = 0;
            for (int i = 0; i < 3; i++) {
              if (entities[i].empty()) continue;

              std::string url = id(ha_base_url) + "/api/calendars/" + entities[i] +
                                "?start=" + id(cal_fetch_start) + "&end=" + id(cal_fetch_end);

              std::vector<esphome::http_request::Header> hdrs;
              hdrs.push_back({"Authorization", auth});

              auto c = id(http_req)->get(url, hdrs);
              if (!c || c->status_code != 200) {
                ESP_LOGW("cal_fetch", "cal%d HTTP %d", i, c ? c->status_code : -1);
                if (c) { http_ms += c->duration_ms; c->end(); }
                continue;
              }

              std::string body;
              drain(c, body);
              any_ok = true;
              total += esp32_dash::calendar_json::append_calendar_events(body, i, new_buf);
            }
          }

          // Only replace the cache when at least one request succeeded, so a
          // transient network failure does not blank both views.
          if (any_ok) {
            id(cal_events_buf) = new_buf;
            id(cal_last_fetch_ms) = millis();
            ESP_LOGI("cal_fetch", "Parsed %d events, buf len=%d, %u ms blocked in HTTP",
                     total, (int) id(cal_events_buf).length(), (unsigned) http_ms);
          } else {
            ESP_LOGW("cal_fetch", "All calendar requests failed (%u ms) — keeping cached data",
                     (unsigned) http_ms);
          }
      - script.execute: render_calendar_grid
      - script.execute: render_idle_agenda

  # ---------------------------------------------------------------------------
  # subscribe_calendar: subscribes to HA state + attributes of calendar slot N.
  # ---------------------------------------------------------------------------
  - id: subscribe_calendar
    parameters:
      slot: int
    mode: restart
    then:
      - lambda: |-
          if (slot < 0 || slot > 2) return;

          esphome::text::Text *sel[3] = {
            id(calendar_entity_select_0),
            id(calendar_entity_select_1),
            id(calendar_entity_select_2)
          };
          int *gens[3] = { &id(cal_sub_gen_0), &id(cal_sub_gen_1), &id(cal_sub_gen_2) };
          std::string *titles[3] = { &id(cal_title_0), &id(cal_title_1), &id(cal_title_2) };
          std::string *starts[3] = { &id(cal_start_0), &id(cal_start_1), &id(cal_start_2) };
          std::string *ends[3]   = { &id(cal_end_0),   &id(cal_end_1),   &id(cal_end_2) };
          std::string *alldays[3] = { &id(cal_all_day_0), &id(cal_all_day_1), &id(cal_all_day_2) };

          std::string entity = sel[slot]->state;

          // Reset slot to unconfigured state
          if (entity.rfind("calendar.", 0) != 0) {
            *titles[slot] = ""; *starts[slot] = ""; *ends[slot] = ""; *alldays[slot] = "";
            id(cal_subbed)[slot] = "";
            (*gens[slot])++;
            id(render_idle_agenda).execute();
            if (!entity.empty()) {
              ESP_LOGW("calendar", "Slot %d: '%s' must start with 'calendar.'", slot, entity.c_str());
            }
            return;
          }

          if (esphome::api::global_api_server == nullptr) return;

          // Already registered for this entity (e.g. HA reconnect) — the API
          // re-sends the existing subscription list to the new client itself.
          if (entity == id(cal_subbed)[slot]) return;
          id(cal_subbed)[slot] = entity;

          (*gens[slot])++;
          int gen = *gens[slot];
          int *gen_ptr = gens[slot];

          std::string *title_ptr = titles[slot];
          std::string *start_ptr = starts[slot];
          std::string *end_ptr   = ends[slot];
          std::string *allday_ptr = alldays[slot];

          auto *api = esphome::api::global_api_server;
          using str_cb = std::function<void(const std::string &)>;

          // These attributes only describe the *next* event, so they are just the
          // agenda's fallback when no token is set; once a fetch has filled
          // cal_events_buf the agenda ignores them and a re-render is wasted.
          auto store = [gen, gen_ptr](std::string *dst) {
            return str_cb([gen, gen_ptr, dst](const std::string &state) {
              if (gen != *gen_ptr) return;
              *dst = state;
              if (id(cal_events_buf).empty()) id(render_idle_agenda).execute();
            });
          };
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("message"), store(title_ptr));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("start_time"), store(start_ptr));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("end_time"), store(end_ptr));
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("all_day"), store(allday_ptr));

          ESP_LOGI("calendar", "Slot %d: subscribed to '%s'", slot, entity.c_str());


# Background refresh — one fetch feeds both the week grid and the idle agenda.
# Skipped on the music view: neither consumer is on screen there, and a blocking
# fetch mid-playback stalls the progress bar and timer countdown for no benefit.
# show_idle_view calls maybe_fetch_calendar, so leaving the music page refreshes
# whatever went stale in the meantime.
interval:
  - interval: 15min
    then:
      - if:
          condition:
            lambda: 'return id(current_view) != 1;'
          then:
            - script.execute: fetch_calendar_data


# Re-subscribe and seed data after HA reconnect (merged with api block in device.yaml)
api:
  on_client_connected:
    - script.execute: {id: subscribe_calendar, slot: 0}
    - script.execute: {id: subscribe_calendar, slot: 1}
    - script.execute: {id: subscribe_calendar, slot: 2}
    - script.execute: fetch_calendar_data
