# =============================================================================
# CALENDAR SENSORS — HA subscription + REST fetch for up to three calendars
# =============================================================================
# Each slot subscribes to a calendar.* entity's state + attributes:
#   message    → event title
#   start_time → "YYYY-MM-DD HH:MM:SS" (or "YYYY-MM-DD" for all-day)
#   end_time   → "YYYY-MM-DD HH:MM:SS" (used to detect past events)
#   all_day    → "True"/"False"
#   location   → description line (calendar page only)
#
# Those attributes only ever expose the *next* event per calendar, so they are
# used purely as a fallback for when no HA access token is configured.
#
# The primary data path is fetch_calendar_data: one REST request per configured
# calendar into the shared cal_events_buf, as pipe-delimited lines:
#   CAL_IDX|TITLE|START_ISO|END_ISO|ALLDAY\n
# Both consumers filter that single buffer by date:
#   render_calendar_grid (calendar_view.yaml) — the 5-day week grid
#   render_idle_agenda   (below)              — today + tomorrow on the idle page
#
# The window always spans the union of what both views need, so one fetch feeds
# both. http_request is synchronous, so each request blocks the main loop (and
# therefore LVGL); keeping this to three requests instead of six halves that.
#
# Subscriptions follow the generation-counter pattern from media_player_select
# and are registered once per entity — see cal_subbed below.
# =============================================================================

substitutions:
  calendar_entity_1: ""
  calendar_entity_2: ""
  calendar_entity_3: ""


# -----------------------------------------------------------------------------
# Raw attribute storage — updated by subscription callbacks before label render
# -----------------------------------------------------------------------------
globals:
  - id: cal_title_0
    type: std::string
    initial_value: '""'
  - id: cal_start_0
    type: std::string
    initial_value: '""'
  - id: cal_end_0
    type: std::string
    initial_value: '""'
  - id: cal_all_day_0
    type: std::string
    initial_value: '""'

  - id: cal_title_1
    type: std::string
    initial_value: '""'
  - id: cal_start_1
    type: std::string
    initial_value: '""'
  - id: cal_end_1
    type: std::string
    initial_value: '""'
  - id: cal_all_day_1
    type: std::string
    initial_value: '""'

  - id: cal_title_2
    type: std::string
    initial_value: '""'
  - id: cal_start_2
    type: std::string
    initial_value: '""'
  - id: cal_end_2
    type: std::string
    initial_value: '""'
  - id: cal_all_day_2
    type: std::string
    initial_value: '""'

  - id: cal_sub_gen_0
    type: int
    initial_value: '0'
  - id: cal_sub_gen_1
    type: int
    initial_value: '0'
  - id: cal_sub_gen_2
    type: int
    initial_value: '0'

  # Entity currently registered with the API state-subscription list, per slot.
  # ESPHome has no unsubscribe (see weather_sensors.yaml for the full rationale),
  # so re-running subscribe_calendar on every reconnect would leak callbacks.
  - id: cal_subbed
    type: std::array<std::string, 3>
    initial_value: '{"","",""}'

  # Shared HTTP fetch buffer — consumed by both render_calendar_grid and
  # render_idle_agenda.
  - id: cal_events_buf
    type: std::string
    initial_value: '""'
  - id: cal_fetch_start   # "YYYY-MM-DDTHH:MM:SS" for the API query start
    type: std::string
    initial_value: '""'
  - id: cal_fetch_end
    type: std::string
    initial_value: '""'

  # millis() of the last successful fetch. Interactive callers (navbar) use this
  # to skip a blocking refetch when the cache is still warm. Unsigned wraparound
  # at ~49 days is handled correctly by the subtraction.
  - id: cal_last_fetch_ms
    type: uint32_t
    initial_value: '0'


# -----------------------------------------------------------------------------
# Entity selector text entities (NVS-persisted, visible in device settings)
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Calendar 1 Entity"
    id: calendar_entity_select_0
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_1}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 0}

  - platform: template
    name: "Calendar 2 Entity"
    id: calendar_entity_select_1
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_2}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 1}

  - platform: template
    name: "Calendar 3 Entity"
    id: calendar_entity_select_2
    entity_category: config
    icon: "mdi:calendar"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${calendar_entity_3}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_calendar, slot: 2}


# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:

  # ---------------------------------------------------------------------------
  # render_idle_agenda
  # ---------------------------------------------------------------------------
  # Populates idle_agenda_slot_0..4 from cal_events_buf, keeping only events that
  # start today or tomorrow. Falls back to the per-calendar subscription globals
  # when the buffer is empty (no ha_token configured). Past events are greyed.
  # ---------------------------------------------------------------------------
  - id: render_idle_agenda
    mode: single
    then:
      - lambda: |-
          auto now_time = id(ha_time).now();
          if (!now_time.is_valid()) return;

          // Build ISO date strings for today and tomorrow
          char today_str[11], tomorrow_str[11];
          snprintf(today_str, sizeof(today_str), "%04d-%02d-%02d",
                   now_time.year, now_time.month, now_time.day_of_month);

          time_t ts_tomorrow = now_time.timestamp + 86400;
          struct tm tm_buf;
          localtime_r(&ts_tomorrow, &tm_buf);
          snprintf(tomorrow_str, sizeof(tomorrow_str), "%04d-%02d-%02d",
                   tm_buf.tm_year + 1900, tm_buf.tm_mon + 1, tm_buf.tm_mday);

          // Build now datetime string for past-event comparison ("YYYY-MM-DD HH:MM:SS")
          char now_dt[20];
          snprintf(now_dt, sizeof(now_dt), "%04d-%02d-%02d %02d:%02d:%02d",
                   now_time.year, now_time.month, now_time.day_of_month,
                   now_time.hour, now_time.minute, now_time.second);

          // Calendar accent colors (matching calendar page slots)
          const uint32_t CAL_COLORS[3] = {0x4A90E2, 0x5BA55A, 0xE2914A};

          // Only the 5 soonest events are ever shown, so cap collection at 12 to
          // keep this lambda's stack frame small (it runs on the main loop task).
          const int MAX_ITEMS = 12;

          struct AgendaItem {
            char start[20];       // "YYYY-MM-DD HH:MM:SS\0" (normalized, space sep)
            char title[64];
            char time_label[48];  // "Tomorrow · 12:00\0"
            uint32_t accent_color;
            bool is_past;
          };

          AgendaItem items[MAX_ITEMS];
          int item_count = 0;
          memset(items, 0, sizeof(items));

          // Helper: build a time_label string and add to items[].
          auto add_item = [&](
              const char *title_c,
              std::string start,   // mutable copy — we normalize T→space
              const std::string &end_s_in,
              bool is_allday,
              int cal_idx) {

            if (!title_c || title_c[0] == '\0') return;
            if (start.length() < 10) return;
            if (item_count >= MAX_ITEMS) return;

            bool is_today    = (strncmp(start.c_str(), today_str, 10) == 0);
            bool is_tomorrow = (strncmp(start.c_str(), tomorrow_str, 10) == 0);
            if (!is_today && !is_tomorrow) return;

            // Normalize T separator → space for consistent ISO comparison
            if (start.length() >= 11 && start[10] == 'T') start[10] = ' ';
            std::string end_s = end_s_in;
            if (end_s.length() >= 11 && end_s[10] == 'T') end_s[10] = ' ';

            // Is past? All-day events count as past only once the day is over,
            // which the today/tomorrow filter already guarantees is not the case.
            bool is_past = false;
            if (!is_allday && end_s.length() >= 19) {
              is_past = (strncmp(end_s.c_str(), now_dt, 19) < 0);
            }

            // Build human-readable time label  e.g. "Today · 09:00–10:00"
            const char *day_prefix = is_today ? "Today" : "Tomorrow";
            char time_buf[48];
            if (is_allday) {
              snprintf(time_buf, sizeof(time_buf), "%s \xc2\xb7 All Day", day_prefix);
            } else if (start.length() >= 16) {
              int sh   = atoi(start.c_str() + 11);
              int smin = atoi(start.c_str() + 14);
              if (end_s.length() >= 16) {
                int eh   = atoi(end_s.c_str() + 11);
                int emin = atoi(end_s.c_str() + 14);
                snprintf(time_buf, sizeof(time_buf), "%s \xc2\xb7 %02d:%02d\xe2\x80\x93%02d:%02d",
                         day_prefix, sh, smin, eh, emin);
              } else {
                snprintf(time_buf, sizeof(time_buf), "%s \xc2\xb7 %02d:%02d",
                         day_prefix, sh, smin);
              }
            } else {
              snprintf(time_buf, sizeof(time_buf), "%s", day_prefix);
            }

            AgendaItem &item = items[item_count++];
            strncpy(item.start,      start.c_str(),  sizeof(item.start)      - 1);
            strncpy(item.title,      title_c,         sizeof(item.title)      - 1);
            strncpy(item.time_label, time_buf,        sizeof(item.time_label) - 1);
            item.accent_color = (cal_idx >= 0 && cal_idx < 3) ? CAL_COLORS[cal_idx] : 0x888888U;
            item.is_past = is_past;
          };

          if (!id(cal_events_buf).empty()) {
            // --- Primary path: parse the shared HTTP-fetched buffer ---
            // Format: "CAL_IDX|TITLE|START|END|ALLDAY\n" (repeated)
            const std::string &buf = id(cal_events_buf);
            size_t pos = 0;
            while (pos < buf.size() && item_count < MAX_ITEMS) {
              size_t nl = buf.find('\n', pos);
              if (nl == std::string::npos) nl = buf.size();
              if (nl > pos) {
                std::string line = buf.substr(pos, nl - pos);
                // Parse pipe-delimited fields
                size_t p1 = line.find('|');
                size_t p2 = (p1 != std::string::npos) ? line.find('|', p1 + 1) : std::string::npos;
                size_t p3 = (p2 != std::string::npos) ? line.find('|', p2 + 1) : std::string::npos;
                size_t p4 = (p3 != std::string::npos) ? line.find('|', p3 + 1) : std::string::npos;
                if (p4 != std::string::npos) {
                  int cal_idx      = atoi(line.c_str());
                  std::string title = line.substr(p1 + 1, p2 - p1 - 1);
                  std::string start = line.substr(p2 + 1, p3 - p2 - 1);
                  std::string end_s = line.substr(p3 + 1, p4 - p3 - 1);
                  bool is_allday   = (line.substr(p4 + 1) == "1");
                  add_item(title.c_str(), start, end_s, is_allday, cal_idx);
                }
              }
              pos = nl + 1;
            }
          } else {
            // --- Fallback path: subscription globals (one event per calendar) ---
            // Used when ha_token is not configured and no fetch has run.
            auto add_sub = [&](
                const std::string &title,
                const std::string &start,
                const std::string &end_s,
                const std::string &all_day_s,
                int cal_idx) {
              bool is_allday = (all_day_s == "True" || all_day_s == "true" || all_day_s == "1");
              add_item(title.c_str(), start, end_s, is_allday, cal_idx);
            };
            add_sub(id(cal_title_0), id(cal_start_0), id(cal_end_0), id(cal_all_day_0), 0);
            add_sub(id(cal_title_1), id(cal_start_1), id(cal_end_1), id(cal_all_day_1), 1);
            add_sub(id(cal_title_2), id(cal_start_2), id(cal_end_2), id(cal_all_day_2), 2);
          }

          // Partial selection sort — only the first 5 entries are displayed, so
          // stop once those are in place instead of ordering the whole array.
          int sort_n = item_count < 5 ? item_count : 5;
          for (int i = 0; i < sort_n; i++) {
            int best = i;
            for (int j = i + 1; j < item_count; j++) {
              if (strcmp(items[j].start, items[best].start) < 0) best = j;
            }
            if (best != i) {
              AgendaItem tmp = items[i];
              items[i] = items[best];
              items[best] = tmp;
            }
          }

          // Widget pointer arrays for agenda slots 0..4
          lv_obj_t *slot_objs[] = {
            id(idle_agenda_slot_0), id(idle_agenda_slot_1), id(idle_agenda_slot_2),
            id(idle_agenda_slot_3), id(idle_agenda_slot_4)
          };
          lv_obj_t *accent_objs[] = {
            id(idle_agenda_accent_0), id(idle_agenda_accent_1), id(idle_agenda_accent_2),
            id(idle_agenda_accent_3), id(idle_agenda_accent_4)
          };
          lv_obj_t *time_labels[] = {
            id(idle_agenda_time_0), id(idle_agenda_time_1), id(idle_agenda_time_2),
            id(idle_agenda_time_3), id(idle_agenda_time_4)
          };
          lv_obj_t *title_labels[] = {
            id(idle_agenda_title_0), id(idle_agenda_title_1), id(idle_agenda_title_2),
            id(idle_agenda_title_3), id(idle_agenda_title_4)
          };

          for (int i = 0; i < 5; i++) {
            if (i < item_count) {
              const AgendaItem &item = items[i];
              lv_obj_clear_flag(slot_objs[i], LV_OBJ_FLAG_HIDDEN);

              uint32_t accent_col = item.is_past ? 0x444444U : item.accent_color;
              uint32_t time_col   = item.is_past ? 0x444444U : item.accent_color;
              uint32_t title_col  = item.is_past ? 0x555555U : 0xDDDDDDU;

              lv_obj_set_style_bg_color(accent_objs[i], lv_color_hex(accent_col), 0);
              lv_obj_set_style_text_color(time_labels[i], lv_color_hex(time_col), 0);
              lv_obj_set_style_text_color(title_labels[i], lv_color_hex(title_col), 0);
              lv_label_set_text(time_labels[i], item.time_label);
              lv_label_set_text(title_labels[i], item.title);
            } else {
              lv_obj_add_flag(slot_objs[i], LV_OBJ_FLAG_HIDDEN);
            }
          }

  # ---------------------------------------------------------------------------
  # fetch_calendar_data
  # ---------------------------------------------------------------------------
  # One REST request per configured calendar into cal_events_buf, then re-renders
  # both consumers. The window spans the union of what the week grid (5 columns
  # from cal_view_offset) and the idle agenda (today + tomorrow) need, so a
  # single fetch serves both.
  #
  # http_request is synchronous: this blocks the main loop for the duration of
  # all three requests. Callers should avoid triggering it on a UI interaction
  # when cached data is still usable.
  # ---------------------------------------------------------------------------
  - id: fetch_calendar_data
    mode: restart
    then:
      - lambda: |-
          auto t = id(ha_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("cal_fetch", "Time not valid, skipping fetch");
            return;
          }
          if (id(ha_token_global).empty()) {
            ESP_LOGW("cal_fetch", "ha_token not set — skipping fetch");
            return;
          }

          // Fixed window covering every view this data can feed:
          //   week grid   — 5 columns from cal_view_offset, which is clamped to
          //                 -1..+2, so days -1 through +6 are reachable
          //   idle agenda — today and tomorrow
          // Fetching the full span once means changing cal_view_offset only needs
          // a re-render, never another blocking round of HTTP requests.
          const int DAY_FROM = -1;
          const int DAY_TO   = 7;   // exclusive

          time_t midnight = t.timestamp - (t.hour * 3600 + t.minute * 60 + t.second);
          time_t base_ts  = midnight + (time_t) DAY_FROM * 86400;
          time_t end_ts   = midnight + (time_t) DAY_TO   * 86400;

          struct tm start_tm, end_tm;
          localtime_r(&base_ts, &start_tm);
          localtime_r(&end_ts,  &end_tm);

          char s[21], e[21];
          snprintf(s, sizeof(s), "%04d-%02d-%02dT00:00:00",
                   start_tm.tm_year + 1900, start_tm.tm_mon + 1, start_tm.tm_mday);
          snprintf(e, sizeof(e), "%04d-%02d-%02dT00:00:00",
                   end_tm.tm_year + 1900,   end_tm.tm_mon + 1,   end_tm.tm_mday);

          id(cal_fetch_start) = std::string(s);
          id(cal_fetch_end)   = std::string(e);
          ESP_LOGI("cal_fetch", "Window %s .. %s", s, e);

          esphome::text::Text *sel[3] = {
            id(calendar_entity_select_0),
            id(calendar_entity_select_1),
            id(calendar_entity_select_2)
          };

          std::string new_buf;
          std::string auth = "Bearer " + id(ha_token_global);
          int total = 0;
          bool any_ok = false;

          for (int i = 0; i < 3; i++) {
            std::string entity = sel[i]->state;
            if (entity.rfind("calendar.", 0) != 0) continue;

            std::string url = id(ha_base_url) + "/api/calendars/" + entity +
                              "?start=" + id(cal_fetch_start) + "&end=" + id(cal_fetch_end);

            std::vector<esphome::http_request::Header> hdrs;
            hdrs.push_back({"Authorization", auth});

            auto container = id(http_req)->get(url, hdrs);
            if (!container || container->status_code != 200) {
              ESP_LOGW("cal_fetch", "cal%d HTTP %d", i,
                       container ? container->status_code : -1);
              if (container) container->end();
              continue;
            }

            std::string body;
            body.reserve(4096);
            uint8_t buf[512];
            int n;
            while ((n = container->read(buf, sizeof(buf))) > 0)
              body.append(reinterpret_cast<char*>(buf), n);
            container->end();

            any_ok = true;
            total += esp32_dash::calendar_json::append_calendar_events(body, i, new_buf);
          }

          // Only replace the cache when at least one request succeeded, so a
          // transient network failure does not blank both views.
          if (any_ok) {
            id(cal_events_buf) = new_buf;
            id(cal_last_fetch_ms) = millis();
            ESP_LOGI("cal_fetch", "Parsed %d events, buf len=%d",
                     total, (int) id(cal_events_buf).length());
          } else {
            ESP_LOGW("cal_fetch", "All calendar requests failed — keeping cached data");
          }
      - script.execute: render_calendar_grid
      - script.execute: render_idle_agenda

  # ---------------------------------------------------------------------------
  # subscribe_calendar: subscribes to HA state + attributes of calendar slot N.
  # ---------------------------------------------------------------------------
  - id: subscribe_calendar
    parameters:
      slot: int
    mode: restart
    then:
      - lambda: |-
          if (slot < 0 || slot > 2) return;

          esphome::text::Text *sel[3] = {
            id(calendar_entity_select_0),
            id(calendar_entity_select_1),
            id(calendar_entity_select_2)
          };
          int *gens[3] = { &id(cal_sub_gen_0), &id(cal_sub_gen_1), &id(cal_sub_gen_2) };
          std::string *titles[3] = { &id(cal_title_0), &id(cal_title_1), &id(cal_title_2) };
          std::string *starts[3] = { &id(cal_start_0), &id(cal_start_1), &id(cal_start_2) };
          std::string *ends[3]   = { &id(cal_end_0),   &id(cal_end_1),   &id(cal_end_2) };
          std::string *alldays[3] = { &id(cal_all_day_0), &id(cal_all_day_1), &id(cal_all_day_2) };
          lv_obj_t *time_lbls[3]  = { id(cal_time_label_0),  id(cal_time_label_1),  id(cal_time_label_2) };
          lv_obj_t *title_lbls[3] = { id(cal_title_label_0), id(cal_title_label_1), id(cal_title_label_2) };
          lv_obj_t *desc_lbls[3]  = { id(cal_desc_label_0),  id(cal_desc_label_1),  id(cal_desc_label_2) };

          std::string entity = sel[slot]->state;

          // Reset slot to unconfigured state
          if (entity.rfind("calendar.", 0) != 0) {
            *titles[slot] = ""; *starts[slot] = ""; *ends[slot] = ""; *alldays[slot] = "";
            id(cal_subbed)[slot] = "";
            (*gens[slot])++;
            lv_label_set_text(time_lbls[slot], "\xe2\x80\x94");
            lv_label_set_text(title_lbls[slot], "No calendar set");
            lv_label_set_text(desc_lbls[slot], "");
            id(render_idle_agenda).execute();
            if (!entity.empty()) {
              ESP_LOGW("calendar", "Slot %d: '%s' must start with 'calendar.'", slot, entity.c_str());
            }
            return;
          }

          if (esphome::api::global_api_server == nullptr) return;

          // Already registered for this entity (e.g. HA reconnect) — the API
          // re-sends the existing subscription list to the new client itself.
          if (entity == id(cal_subbed)[slot]) return;
          id(cal_subbed)[slot] = entity;

          (*gens[slot])++;
          int gen = *gens[slot];
          int *gen_ptr = gens[slot];

          std::string *title_ptr = titles[slot];
          std::string *start_ptr = starts[slot];
          std::string *end_ptr   = ends[slot];
          std::string *allday_ptr = alldays[slot];
          lv_obj_t *time_lbl  = time_lbls[slot];
          lv_obj_t *title_lbl = title_lbls[slot];
          lv_obj_t *desc_lbl  = desc_lbls[slot];

          auto *api = esphome::api::global_api_server;
          using str_cb = std::function<void(const std::string &)>;

          auto fmt_time = [](const std::string &start, const std::string &all_day) -> std::string {
            if (all_day == "True" || all_day == "true" || all_day == "1") return std::string("All Day");
            if (start.length() < 16) return std::string("");
            int hour   = atoi(start.substr(11, 2).c_str());
            int minute = atoi(start.substr(14, 2).c_str());
            const char *ap = hour >= 12 ? "PM" : "AM";
            int h12 = hour % 12; if (h12 == 0) h12 = 12;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d %s", h12, minute, ap);
            return std::string(buf);
          };

          // The agenda only consults these globals when cal_events_buf is empty,
          // so a re-render is pointless (and costly) once a fetch has succeeded.
          auto agenda_needs_refresh = []() { return id(cal_events_buf).empty(); };

          // message → title label + agenda re-render
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("message"),
              str_cb([gen, gen_ptr, title_ptr, title_lbl, agenda_needs_refresh](const std::string &state) {
                if (gen != *gen_ptr) return;
                *title_ptr = state;
                lv_label_set_text(title_lbl, state.empty() ? "No upcoming events" : state.c_str());
                if (agenda_needs_refresh()) id(render_idle_agenda).execute();
              }));

          // start_time → time label + agenda re-render
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("start_time"),
              str_cb([gen, gen_ptr, start_ptr, allday_ptr, time_lbl, fmt_time,
                      agenda_needs_refresh](const std::string &state) {
                if (gen != *gen_ptr) return;
                *start_ptr = state;
                std::string ts = fmt_time(state, *allday_ptr);
                lv_label_set_text(time_lbl, ts.empty() ? "\xe2\x80\x94" : ts.c_str());
                if (agenda_needs_refresh()) id(render_idle_agenda).execute();
              }));

          // end_time → stored for past-event detection
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("end_time"),
              str_cb([gen, gen_ptr, end_ptr, agenda_needs_refresh](const std::string &state) {
                if (gen != *gen_ptr) return;
                *end_ptr = state;
                if (agenda_needs_refresh()) id(render_idle_agenda).execute();
              }));

          // all_day → update time label
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("all_day"),
              str_cb([gen, gen_ptr, allday_ptr, start_ptr, time_lbl, fmt_time](const std::string &state) {
                if (gen != *gen_ptr) return;
                *allday_ptr = state;
                std::string ts = fmt_time(*start_ptr, state);
                lv_label_set_text(time_lbl, ts.empty() ? "\xe2\x80\x94" : ts.c_str());
              }));

          // location → description label (calendar page only)
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("location"),
              str_cb([gen, gen_ptr, desc_lbl](const std::string &state) {
                if (gen != *gen_ptr) return;
                lv_label_set_text(desc_lbl, state.c_str());
              }));

          ESP_LOGI("calendar", "Slot %d: subscribed to '%s'", slot, entity.c_str());


# Background refresh — one fetch feeds both the week grid and the idle agenda.
interval:
  - interval: 15min
    then:
      - script.execute: fetch_calendar_data


# Re-subscribe and seed data after HA reconnect (merged with api block in device.yaml)
api:
  on_client_connected:
    - script.execute: {id: subscribe_calendar, slot: 0}
    - script.execute: {id: subscribe_calendar, slot: 1}
    - script.execute: {id: subscribe_calendar, slot: 2}
    - script.execute: fetch_calendar_data
