# =============================================================================
# TIMER OVERLAY — active HA timers, shown in the right of the nav bar
# =============================================================================
# When any configured timer.* entity is active, timer_bar fills the right-hand
# 480 px of the nav bar (the same split as the idle and music pages) and the
# four nav buttons narrow to share the left 800 px. It shows the soonest-
# expiring timer's name and time remaining, plus a "+N" badge when several are
# running. It lives inside the nav bar rather than floating above it, so it
# never covers page content such as the music progress bar.
#
# The bar dismisses on tap and reappears on the next HA remaining update.
#
# Remaining time is computed from HA's `finishes_at` attribute against the
# clock, not by decrementing a counter: a counter loses every second the main
# loop is blocked (the calendar fetch stalls it for seconds at a time), and HA
# only updates `remaining` on state changes, so after a reconnect it is stale.
# The counter is kept only as a fallback before the clock has synced.
#
# Substitutions (set in packages.yaml or user config):
#   timer_entity_1..3  — HA timer.* entity IDs (default "")
#
# Timer names are read from input_text.timer_name_<suffix> where the suffix
# is the part of the timer entity ID after "timer." (e.g. timer.slot_1 → input_text.timer_name_slot_1).
#
# Entity selectors are also exposed as NVS-persisted text entities in HA device
# settings, following the same pattern as calendar_entity_1..3.
# =============================================================================

substitutions:
  timer_entity_1: ""
  timer_entity_2: ""
  timer_entity_3: ""


globals:
  - id: tmr_state_0
    type: std::string
    initial_value: '""'
  - id: tmr_state_1
    type: std::string
    initial_value: '""'
  - id: tmr_state_2
    type: std::string
    initial_value: '""'

  - id: tmr_remaining_secs_0
    type: int
    initial_value: '0'
  - id: tmr_remaining_secs_1
    type: int
    initial_value: '0'
  - id: tmr_remaining_secs_2
    type: int
    initial_value: '0'

  # Unix time the timer ends (from the `finishes_at` attribute), or 0 when not
  # known. Only meaningful while the timer is active; HA drops the attribute
  # when it pauses or finishes.
  - id: tmr_finishes_0
    type: int64_t
    initial_value: '0'
  - id: tmr_finishes_1
    type: int64_t
    initial_value: '0'
  - id: tmr_finishes_2
    type: int64_t
    initial_value: '0'

  - id: tmr_name_0
    type: std::string
    initial_value: '""'
  - id: tmr_name_1
    type: std::string
    initial_value: '""'
  - id: tmr_name_2
    type: std::string
    initial_value: '""'

  - id: tmr_active_count
    type: int
    initial_value: '0'

  - id: tmr_dismissed
    type: bool
    initial_value: 'false'

  - id: tmr_sub_gen_0
    type: int
    initial_value: '0'
  - id: tmr_sub_gen_1
    type: int
    initial_value: '0'
  - id: tmr_sub_gen_2
    type: int
    initial_value: '0'

  # Entity currently registered with the API state-subscription list, per slot.
  # ESPHome has no unsubscribe (see weather_sensors.yaml), so re-running this on
  # every reconnect would leak three callbacks per slot forever.
  - id: tmr_subbed
    type: std::array<std::string, 3>
    initial_value: '{"","",""}'


# -----------------------------------------------------------------------------
# Entity selector text entities (NVS-persisted, visible in device settings)
# -----------------------------------------------------------------------------
text:
  - platform: template
    name: "Timer 1 Entity"
    id: timer_entity_select_0
    entity_category: config
    icon: "mdi:timer"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${timer_entity_1}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_timer, slot: 0}

  - platform: template
    name: "Timer 2 Entity"
    id: timer_entity_select_1
    entity_category: config
    icon: "mdi:timer"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${timer_entity_2}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_timer, slot: 1}

  - platform: template
    name: "Timer 3 Entity"
    id: timer_entity_select_2
    entity_category: config
    icon: "mdi:timer"
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "${timer_entity_3}"
    min_length: 0
    max_length: 100
    on_value:
      - script.execute: {id: subscribe_timer, slot: 2}


# -----------------------------------------------------------------------------
# Scripts
# -----------------------------------------------------------------------------
script:

  # ---------------------------------------------------------------------------
  # update_timer_bar: finds the soonest active timer, updates the overlay UI.
  # Hides the bar when no timers are active or when dismissed.
  # ---------------------------------------------------------------------------
  - id: update_timer_bar
    mode: single
    then:
      - lambda: |-
          std::string *states[3] = {&id(tmr_state_0), &id(tmr_state_1), &id(tmr_state_2)};
          int *secs[3] = {&id(tmr_remaining_secs_0), &id(tmr_remaining_secs_1), &id(tmr_remaining_secs_2)};
          int64_t fins[3] = {id(tmr_finishes_0), id(tmr_finishes_1), id(tmr_finishes_2)};

          // Re-derive remaining time from the end timestamp whenever it is known.
          auto now = id(ha_time).now();
          if (now.is_valid()) {
            for (int i = 0; i < 3; i++) {
              if (*states[i] == "active" && fins[i] > 0) {
                int64_t left = fins[i] - (int64_t) now.timestamp;
                *secs[i] = left > 0 ? (int) left : 0;
              }
            }
          }

          int active_count = 0;
          int soonest_secs = INT_MAX;
          int soonest_idx = -1;
          for (int i = 0; i < 3; i++) {
            if (*states[i] == "active") {
              active_count++;
              if (*secs[i] < soonest_secs) {
                soonest_secs = *secs[i];
                soonest_idx = i;
              }
            }
          }
          id(tmr_active_count) = active_count;

          bool show = active_count > 0 && !id(tmr_dismissed);
          if (show == lv_obj_has_flag(id(timer_bar), LV_OBJ_FLAG_HIDDEN)) {
            if (show) lv_obj_clear_flag(id(timer_bar), LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(id(timer_bar), LV_OBJ_FLAG_HIDDEN);
            id(layout_nav_bar).execute();
          }
          if (!show) return;

          // Name label — show soonest timer's friendly name. The name comes from
          // an optional input_text helper, so fall back to a generic label rather
          // than rendering an empty bar when that helper does not exist.
          std::string *names[3] = {&id(tmr_name_0), &id(tmr_name_1), &id(tmr_name_2)};
          const std::string &soonest_name = *names[soonest_idx];
          lv_label_set_text(id(tmr_bar_name_lbl),
                            soonest_name.empty() ? "Timer" : soonest_name.c_str());

          // "+N more" badge — visible only when multiple timers are active
          if (active_count > 1) {
            char badge[16];
            snprintf(badge, sizeof(badge), "+%d", active_count - 1);
            lv_label_set_text(id(tmr_bar_more_lbl), badge);
            lv_obj_clear_flag(id(tmr_bar_more_lbl), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(tmr_bar_more_lbl), LV_OBJ_FLAG_HIDDEN);
          }

          // Time label — MM:SS or H:MM:SS
          int s = soonest_secs < 0 ? 0 : soonest_secs;
          char time_buf[16];
          if (s >= 3600)
            snprintf(time_buf, sizeof(time_buf), "%d:%02d:%02d", s / 3600, (s % 3600) / 60, s % 60);
          else
            snprintf(time_buf, sizeof(time_buf), "%d:%02d", s / 60, s % 60);
          lv_label_set_text(id(tmr_bar_time_lbl), time_buf);

          // Red when < 60 seconds remaining
          lv_obj_set_style_text_color(id(tmr_bar_time_lbl),
              s < 60 ? lv_color_hex(0xFF6B6B) : lv_color_hex(0xEEEEEE), 0);

  # ---------------------------------------------------------------------------
  # tick_timers: called every 1 s to refresh the countdown. Timers with a known
  # finishes_at are recomputed from the clock in update_timer_bar; the others
  # (clock not synced yet, or finishes_at not received) fall back to counting
  # down locally.
  # ---------------------------------------------------------------------------
  - id: tick_timers
    mode: single
    then:
      - lambda: |-
          bool any_active = false;
          bool clock_ok = id(ha_time).now().is_valid();
          std::string *states[3] = {&id(tmr_state_0), &id(tmr_state_1), &id(tmr_state_2)};
          int *secs[3] = {&id(tmr_remaining_secs_0), &id(tmr_remaining_secs_1), &id(tmr_remaining_secs_2)};
          int64_t fins[3] = {id(tmr_finishes_0), id(tmr_finishes_1), id(tmr_finishes_2)};
          for (int i = 0; i < 3; i++) {
            if (*states[i] == "active") {
              any_active = true;
              if ((fins[i] == 0 || !clock_ok) && *secs[i] > 0) (*secs[i])--;
            }
          }
          // Keep counting down while dismissed so the value stays accurate, but
          // skip the LVGL work — the bar is hidden until HA pushes "remaining".
          if (any_active && !id(tmr_dismissed)) id(update_timer_bar).execute();

  # ---------------------------------------------------------------------------
  # subscribe_timer: subscribes to HA state + remaining + friendly_name
  # attributes for timer slot N. Uses generation counter to invalidate stale
  # callbacks when the entity changes (same pattern as subscribe_calendar).
  # ---------------------------------------------------------------------------
  - id: subscribe_timer
    parameters:
      slot: int
    mode: restart
    then:
      - lambda: |-
          std::string entity;
          switch (slot) {
            case 0: entity = id(timer_entity_select_0).state; break;
            case 1: entity = id(timer_entity_select_1).state; break;
            case 2: entity = id(timer_entity_select_2).state; break;
            default: return;
          }

          // Reset slot if entity is not configured or has wrong prefix
          if (entity.rfind("timer.", 0) != 0) {
            switch (slot) {
              case 0: id(tmr_state_0) = ""; id(tmr_remaining_secs_0) = 0; id(tmr_finishes_0) = 0; id(tmr_name_0) = ""; break;
              case 1: id(tmr_state_1) = ""; id(tmr_remaining_secs_1) = 0; id(tmr_finishes_1) = 0; id(tmr_name_1) = ""; break;
              default: id(tmr_state_2) = ""; id(tmr_remaining_secs_2) = 0; id(tmr_finishes_2) = 0; id(tmr_name_2) = ""; break;
            }
            id(tmr_subbed)[slot] = "";
            id(update_timer_bar).execute();
            if (!entity.empty())
              ESP_LOGW("timer", "Slot %d: '%s' must start with 'timer.'", slot, entity.c_str());
            return;
          }

          if (esphome::api::global_api_server == nullptr) return;

          // Already registered for this entity (e.g. HA reconnect) — the API
          // re-sends the existing subscription list to the new client itself.
          if (entity == id(tmr_subbed)[slot]) return;
          id(tmr_subbed)[slot] = entity;

          int *gen_ctr;
          std::string *state_ptr, *name_ptr;
          int *secs_ptr;
          int64_t *fin_ptr;
          switch (slot) {
            case 0:
              gen_ctr = &id(tmr_sub_gen_0);
              state_ptr = &id(tmr_state_0); secs_ptr = &id(tmr_remaining_secs_0);
              fin_ptr = &id(tmr_finishes_0); name_ptr = &id(tmr_name_0); break;
            case 1:
              gen_ctr = &id(tmr_sub_gen_1);
              state_ptr = &id(tmr_state_1); secs_ptr = &id(tmr_remaining_secs_1);
              fin_ptr = &id(tmr_finishes_1); name_ptr = &id(tmr_name_1); break;
            default:
              gen_ctr = &id(tmr_sub_gen_2);
              state_ptr = &id(tmr_state_2); secs_ptr = &id(tmr_remaining_secs_2);
              fin_ptr = &id(tmr_finishes_2); name_ptr = &id(tmr_name_2); break;
          }

          (*gen_ctr)++;
          int gen = *gen_ctr;
          int *gen_ptr = gen_ctr;

          auto *api = esphome::api::global_api_server;
          using str_cb = std::function<void(const std::string &)>;

          // state → "active" / "idle" / "paused"
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>(),
              str_cb([gen, gen_ptr, state_ptr, fin_ptr](const std::string &state) {
                if (gen != *gen_ptr) return;
                *state_ptr = state;
                // HA removes finishes_at on pause/finish but does not push the
                // removal, so drop it here. On resume the new value arrives with
                // the state change; until then `remaining` (updated on pause) is
                // used instead of a stale end time.
                if (state != "active") *fin_ptr = 0;
                id(update_timer_bar).execute();
              }));

          // finishes_at → absolute end time, e.g. "2026-10-04T12:34:56+00:00"
          // (fractional seconds optional). The countdown is derived from this.
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("finishes_at"),
              str_cb([gen, gen_ptr, fin_ptr](const std::string &state) {
                if (gen != *gen_ptr) return;
                int yr, mo, dy, hr, mn, sc, n = 0;
                if (sscanf(state.c_str(), "%d-%d-%dT%d:%d:%d%n", &yr, &mo, &dy, &hr, &mn, &sc, &n) != 6) {
                  *fin_ptr = 0;
                  return;
                }
                const char *p = state.c_str() + n;
                if (*p == '.') {
                  p++;
                  while (*p >= '0' && *p <= '9') p++;
                }
                int offset = 0;
                if (*p == '+' || *p == '-') {
                  int oh = 0, om = 0;
                  sscanf(p + 1, "%d:%d", &oh, &om);
                  offset = (oh * 3600 + om * 60) * (*p == '-' ? -1 : 1);
                }
                // Days since the Unix epoch (same civil-date formula as
                // media_position_updated_at in sensors.yaml).
                int y = yr, m = mo;
                if (m <= 2) { y--; m += 12; }
                int64_t days = 365LL*y + y/4 - y/100 + y/400 + (153*(m-3)+2)/5 + dy - 719469;
                *fin_ptr = days * 86400LL + hr * 3600 + mn * 60 + sc - offset;
                id(update_timer_bar).execute();
              }));

          // remaining attribute → "H:MM:SS"; parse to seconds.
          // Also clears tmr_dismissed so bar reappears after tap-dismiss.
          api->subscribe_home_assistant_state(entity, esphome::optional<std::string>("remaining"),
              str_cb([gen, gen_ptr, secs_ptr](const std::string &state) {
                if (gen != *gen_ptr) return;
                int h = 0, m = 0, s = 0;
                sscanf(state.c_str(), "%d:%d:%d", &h, &m, &s);
                *secs_ptr = h * 3600 + m * 60 + s;
                id(tmr_dismissed) = false;
                id(update_timer_bar).execute();
              }));

          // input_text.timer_name_<slot> state → user-assigned timer name
          // Derive entity ID: "timer.slot_1" → "input_text.timer_name_slot_1"
          std::string name_entity = "input_text.timer_name_" + entity.substr(6);
          api->subscribe_home_assistant_state(name_entity, esphome::optional<std::string>(),
              str_cb([gen, gen_ptr, name_ptr](const std::string &state) {
                if (gen != *gen_ptr) return;
                *name_ptr = state;
                id(update_timer_bar).execute();
              }));


# 1-second local countdown between HA remaining-attribute updates
interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(tmr_active_count) > 0;'
          then:
            - script.execute: tick_timers


# Re-subscribe to all timer slots after HA reconnect
api:
  on_client_connected:
    - script.execute: {id: subscribe_timer, slot: 0}
    - script.execute: {id: subscribe_timer, slot: 1}
    - script.execute: {id: subscribe_timer, slot: 2}


lvgl:
  on_boot:
    # Move timer_bar into the nav bar (itself reparented to lv_layer_top() in
    # navbar.yaml), so it shows on every page and shares the nav bar's hidden
    # state during boot and setup. Its x/y below are relative to the nav bar.
    - lambda: |-
        lv_obj_set_parent(id(timer_bar), id(nav_bar));

  pages:
    # -------------------------------------------------------------------------
    # TIMER LAYER PAGE — placeholder page; timer_bar is reparented on boot.
    # -------------------------------------------------------------------------
    - id: timer_layer_page
      scrollable: false
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_opa: 0%
      widgets:
        # Right-hand 480 px of the 60 px nav bar. layout_nav_bar (navbar.yaml)
        # narrows the nav buttons into the left 800 px while this is visible.
        - button:
            id: timer_bar
            x: 800
            y: 0
            width: 480
            height: 60
            bg_color: 0x242424
            bg_opa: 100%
            border_width: 0
            radius: 0
            shadow_width: 0
            pad_top: 0
            pad_bottom: 0
            pad_left: 18
            pad_right: 22
            hidden: true
            layout:
              type: flex
              flex_flow: ROW
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
              pad_column: 12
            on_click:
              - lambda: |-
                  id(tmr_dismissed) = true;
                  lv_obj_add_flag(id(timer_bar), LV_OBJ_FLAG_HIDDEN);
                  id(layout_nav_bar).execute();
            widgets:
              # Timer icon (mdi:timer-outline)
              - label:
                  id: tmr_bar_icon_lbl
                  text: $icon_timer
                  text_font: icon_font
                  text_color: 0xCCCCCC

              # Timer name (soonest-expiring active timer). Takes the free width
              # and ellipsises, so a long name never pushes the time off-screen.
              - label:
                  id: tmr_bar_name_lbl
                  flex_grow: 1
                  height: 36
                  text: ""
                  text_font: roboto_light30_font
                  text_color: 0xEEEEEE
                  text_align: left
                  long_mode: dot

              # "+N" badge — shown only when multiple timers are active
              - label:
                  id: tmr_bar_more_lbl
                  text: ""
                  text_font: roboto_light30_font
                  text_color: 0x6CB4F0
                  hidden: true

              # Time remaining (turns red when < 60 s)
              - label:
                  id: tmr_bar_time_lbl
                  text: ""
                  text_font: roboto30_font
                  text_color: 0xEEEEEE
