# =============================================================================
# NAVBAR & MULTI-VIEW PAGES
# =============================================================================
# Adds current_view global, view-switching scripts, and the navigation bar
# widget (visible on ALL views including music).
# idle_page is defined in device/idle_view.yaml (Phase 3).
# calendar_page is defined in device/calendar_view.yaml (Phase 4).
#
# The nav_bar widget is defined here and moved to lv_layer_top() in on_boot so
# it floats above all pages. The active view is marked by update_nav_highlight;
# while a timer is running, layout_nav_bar gives its right 480 px to timer_bar.
#
# Pages defined here are merged with music_page from device/lvgl.yaml via
# ESPHome package merging of the `lvgl.pages` list.
# =============================================================================

globals:
  - id: current_view    # 0=idle 1=music 2=calendar 3=forecast
    type: int
    initial_value: '0'


script:
  - id: show_idle_view
    mode: single
    then:
      - lambda: 'id(current_view) = 0;'
      - script.execute: update_nav_highlight
      - script.execute: update_idle_clock  # also calls render_idle_agenda internally
      - lvgl.page.show: idle_page
      - lvgl.widget.show: nav_bar
      # The agenda lives here too, and the 15-minute background refresh is
      # suppressed while the music view is up — so catch up on anything that
      # went stale while the user was on that page.
      - script.execute: maybe_fetch_calendar

  - id: show_music_view
    mode: single
    then:
      - lambda: 'id(current_view) = 1;'
      - script.execute: update_nav_highlight
      - lvgl.page.show: music_page
      - lvgl.widget.show: nav_bar

  # http_request is synchronous, so a fetch here stalls the main loop (and LVGL)
  # until it completes. Show the cached render first and hand the refresh to
  # maybe_fetch_*, which defers it past the page transition and skips it
  # entirely while the cache is warm — so these scripts never block.
  - id: show_calendar_view
    mode: single
    then:
      # Always open on today, scrolled to the current time.
      - lambda: |-
          id(current_view) = 2;
          id(cal_view_offset) = 0;
      - script.execute: update_nav_highlight
      - script.execute: update_calendar_date
      - script.execute: render_calendar_grid  # render on hidden page before showing
      - script.execute: scroll_calendar_to_now
      - lvgl.page.show: calendar_page
      - lvgl.widget.show: nav_bar
      - script.execute: maybe_fetch_calendar

  - id: show_forecast_view
    mode: single
    then:
      - lambda: 'id(current_view) = 3;'
      - script.execute: update_nav_highlight
      - script.execute: render_forecast    # show cached data immediately before the page appears
      - lvgl.page.show: forecast_page
      - lvgl.widget.show: nav_bar
      - script.execute: maybe_fetch_forecast

  # Marks the current view's nav button: bright icon plus an accent bar along
  # the top edge; the other icons are dimmed.
  - id: update_nav_highlight
    mode: single
    then:
      - lambda: |-
          lv_obj_t *icons[4] = {id(nav_home_icon), id(nav_music_icon),
                                id(nav_calendar_icon), id(nav_forecast_icon)};
          lv_obj_t *marks[4] = {id(nav_home_mark), id(nav_music_mark),
                                id(nav_calendar_mark), id(nav_forecast_mark)};
          for (int i = 0; i < 4; i++) {
            bool active = (i == id(current_view));
            lv_obj_set_style_text_color(icons[i], lv_color_hex(active ? 0xFFFFFF : 0x7A7A7A), 0);
            if (active) lv_obj_clear_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
            else lv_obj_add_flag(marks[i], LV_OBJ_FLAG_HIDDEN);
          }

  # Splits the nav bar while a timer is showing: the four buttons share the
  # left 800 px and timer_bar (timer_overlay.yaml) takes the right 480 px —
  # the same split the idle and music pages use. Full width otherwise.
  - id: layout_nav_bar
    mode: single
    then:
      - lambda: |-
          bool timer = !lv_obj_has_flag(id(timer_bar), LV_OBJ_FLAG_HIDDEN);
          const int w = timer ? 200 : 320;
          lv_obj_t *btns[4] = {id(nav_home_btn), id(nav_music_btn),
                               id(nav_calendar_btn), id(nav_forecast_btn)};
          for (int i = 0; i < 4; i++) {
            lv_obj_set_x(btns[i], i * w);
            lv_obj_set_width(btns[i], w);
          }

  # Returns to music view (if playing) or idle view (if not) after a
  # configurable period of inactivity. Mode restart means any touch resets it.
  - id: start_view_return_timeout
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(view_return_timeout).state > 0;'
          then:
            - delay: !lambda 'return (uint32_t)(id(view_return_timeout).state * 1000);'
            - if:
                condition:
                  lambda: |-
                    return id(media_player_state_sensor).has_state()
                        && id(media_player_state_sensor).state == "playing";
                then:
                  - if:
                      condition:
                        lambda: 'return id(current_view) != 1;'
                      then:
                        - script.execute: show_music_view
                else:
                  - if:
                      condition:
                        lambda: 'return id(current_view) != 0;'
                      then:
                        - script.execute: show_idle_view


lvgl:
  on_boot:
    # Move nav_bar out of its placeholder page into the LVGL top layer so it
    # persists across all page transitions.
    - lambda: |-
        lv_obj_set_parent(id(nav_bar), lv_layer_top());
    # Boot to idle page only after the device has been fully set up;
    # first-time setup keeps music_page active so the setup prompts are visible.
    - if:
        condition:
          lambda: 'return id(device_has_been_setup);'
        then:
          - script.execute: show_idle_view

  pages:
    # -------------------------------------------------------------------------
    # FORECAST PAGE — defined in device/forecast_view.yaml
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # NAV LAYER PAGE — holds nav_bar; widget is reparented to lv_layer_top on boot
    # -------------------------------------------------------------------------
    - id: nav_layer_page
      scrollable: false
      scrollbar_mode: "off"
      width: 100%
      height: 100%
      bg_opa: 0%
      widgets:
        - obj:
            id: nav_bar
            x: 0
            y: 740
            width: 1280
            height: 60
            bg_color: 0x1A1A1A
            bg_opa: 95%
            border_width: 0
            radius: 0
            pad_all: 0
            # Starts hidden so it does not flash during boot/setup prompts; every
            # show_*_view script (including show_music_view) then reveals it.
            hidden: true

            widgets:
              # Nav buttons dispatch via LVGL on_click on each button: on
              # release, and only if the finger did not slide off — so a scroll
              # that ends on the nav bar does not switch view. The ESPHome
              # touchscreen on_release callback in device.yaml operates in
              # panel-native portrait coordinates and cannot reliably identify
              # landscape navbar regions, so LVGL hit-testing (which runs after
              # rotate_coordinates) is the sole dispatch path.

              # ---- Home ----
              - button:
                  id: nav_home_btn
                  x: 0
                  y: 0
                  width: 320
                  height: 60
                  bg_color: 0x1A1A1A
                  bg_opa: 0%
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  pad_all: 0
                  on_click:
                    - script.execute: show_idle_view
                  widgets:
                    - label:
                        id: nav_home_icon
                        text: $icon_home
                        text_font: icon_font
                        text_color: 0x7A7A7A
                        align: CENTER
                    - obj:
                        id: nav_home_mark
                        align: TOP_MID
                        width: 48
                        height: 3
                        bg_color: 0x6CB4F0
                        bg_opa: 100%
                        border_width: 0
                        radius: 0
                        clickable: false
                        hidden: true

              # ---- Music ----
              - button:
                  id: nav_music_btn
                  x: 320
                  y: 0
                  width: 320
                  height: 60
                  bg_color: 0x1A1A1A
                  bg_opa: 0%
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  pad_all: 0
                  on_click:
                    - script.execute: show_music_view
                  widgets:
                    - label:
                        id: nav_music_icon
                        text: $icon_music
                        text_font: icon_font
                        text_color: 0x7A7A7A
                        align: CENTER
                    - obj:
                        id: nav_music_mark
                        align: TOP_MID
                        width: 48
                        height: 3
                        bg_color: 0x6CB4F0
                        bg_opa: 100%
                        border_width: 0
                        radius: 0
                        clickable: false
                        hidden: true

              # ---- Calendar ----
              - button:
                  id: nav_calendar_btn
                  x: 640
                  y: 0
                  width: 320
                  height: 60
                  bg_color: 0x1A1A1A
                  bg_opa: 0%
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  pad_all: 0
                  on_click:
                    - script.execute: show_calendar_view
                  widgets:
                    - label:
                        id: nav_calendar_icon
                        text: $icon_calendar
                        text_font: icon_font
                        text_color: 0x7A7A7A
                        align: CENTER
                    - obj:
                        id: nav_calendar_mark
                        align: TOP_MID
                        width: 48
                        height: 3
                        bg_color: 0x6CB4F0
                        bg_opa: 100%
                        border_width: 0
                        radius: 0
                        clickable: false
                        hidden: true

              # ---- Forecast ----
              - button:
                  id: nav_forecast_btn
                  x: 960
                  y: 0
                  width: 320
                  height: 60
                  bg_color: 0x1A1A1A
                  bg_opa: 0%
                  border_width: 0
                  radius: 0
                  shadow_width: 0
                  pad_all: 0
                  on_click:
                    - script.execute: show_forecast_view
                  widgets:
                    - label:
                        id: nav_forecast_icon
                        text: $icon_forecast
                        text_font: icon_font
                        text_color: 0x7A7A7A
                        align: CENTER
                    - obj:
                        id: nav_forecast_mark
                        align: TOP_MID
                        width: 48
                        height: 3
                        bg_color: 0x6CB4F0
                        bg_opa: 100%
                        border_width: 0
                        radius: 0
                        clickable: false
                        hidden: true
