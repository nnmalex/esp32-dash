# =============================================================================
# FORECAST SENSORS — HTTP fetch + data storage for 7-day weather forecast
# =============================================================================
# Fetches daily forecast via HA's weather.get_forecasts service:
#   POST /api/services/weather/get_forecasts?return_response=true
#   Body: {"entity_id": "<weather_entity>", "type": "daily"}
#
# Requires: ha_token substitution (stored in ha_token_global)
# Requires: weather_entity_select (from weather_sensors.yaml)
# Produces: wf_data_buf — pipe-delimited lines, one per forecast day:
#           "DAYNAME|DAYNUM|HIGH|LOW|PRECIP|PROB|COND\n"
#           e.g. "TUE|31|15.0|4.0|0.10|54|cloudy\n"
#
# render_forecast (forecast_view.yaml) is called after a successful fetch.
# Auto-refresh: every 30 minutes while forecast view is active.
# =============================================================================

globals:
  - id: wf_data_buf
    type: std::string
    restore_value: false
    initial_value: '""'

  # millis() of the last successful fetch; lets the navbar skip a blocking
  # refetch while the cache is warm.
  - id: wf_last_fetch_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'


script:
  # ---------------------------------------------------------------------------
  # maybe_fetch_forecast
  # The interactive entry point: the delay lets the page transition finish
  # drawing before the blocking fetch stalls the loop, and mode: restart means
  # repeated navbar taps coalesce into one fetch. Callers render cached data
  # first and come here for the refresh.
  # ---------------------------------------------------------------------------
  - id: maybe_fetch_forecast
    mode: restart
    then:
      - delay: 300ms
      - if:
          condition:
            lambda: |-
              return id(wf_data_buf).empty()
                  || (millis() - id(wf_last_fetch_ms)) > 900000;
          then:
            - script.execute: fetch_forecast

  # ---------------------------------------------------------------------------
  # fetch_forecast
  # POSTs to HA forecast service and parses the daily forecast array.
  # Populates wf_data_buf, then calls render_forecast.
  # ---------------------------------------------------------------------------
  - id: fetch_forecast
    mode: restart
    then:
      - lambda: |-
          std::string entity = id(weather_entity_select).state;
          std::string token  = id(ha_token_global);

          if (entity.empty() || entity.substr(0, 8) != "weather.") {
            ESP_LOGW("forecast", "No weather entity configured — skipping fetch");
            return;
          }
          if (token.empty()) {
            ESP_LOGW("forecast", "ha_token not set — skipping fetch");
            return;
          }

          std::string url  = id(ha_base_url)
                           + "/api/services/weather/get_forecasts?return_response=true";
          std::string body = "{\"entity_id\": \"" + entity + "\", \"type\": \"daily\"}";

          std::vector<esphome::http_request::Header> hdrs;
          hdrs.push_back({"Authorization", "Bearer " + token});
          hdrs.push_back({"Content-Type", "application/json"});

          ESP_LOGI("forecast", "Fetching forecast for %s", entity.c_str());
          auto container = id(http_req)->post(url, body, hdrs);

          if (!container || container->status_code != 200) {
            int sc = container ? container->status_code : -1;
            ESP_LOGW("forecast", "HTTP error %d", sc);
            if (container) container->end();
            return;
          }

          // Read full response body in 4 KB chunks (matching buffer_size_rx),
          // off the heap rather than the loop task's stack.
          std::string resp;
          resp.reserve(container->content_length > 0
                           ? (size_t) container->content_length + 1
                           : 8192u);
          std::vector<uint8_t> chunk(4096);
          int n;
          while ((n = container->read(chunk.data(), chunk.size())) > 0)
            resp.append(reinterpret_cast<char*>(chunk.data()), n);
          uint32_t http_ms = container->duration_ms;
          container->end();
          ESP_LOGI("forecast", "Fetch blocked the loop for %u ms", (unsigned) http_ms);

          // HA wraps the forecast under service_response.<entity_id>.forecast
          // when return_response=true. Unwrap two levels before looking for
          // the "forecast" key, since extract_array_field only matches depth 1.
          std::string forecast_arr;
          std::string svc_resp;
          bool found = false;
          if (esp32_dash::calendar_json::extract_object_field(resp, "service_response", svc_resp)) {
            size_t inner = 1;
            while (inner < svc_resp.size() && svc_resp[inner] != '{') inner++;
            if (inner < svc_resp.size()) {
              size_t inner_end = 0;
              if (esp32_dash::calendar_json::extract_object_span(svc_resp, inner, inner_end)) {
                std::string entity_obj(svc_resp, inner, inner_end - inner + 1);
                found = esp32_dash::calendar_json::extract_array_field(entity_obj, "forecast", forecast_arr);
              }
            }
          }
          if (!found) {
            // Fallback: response already at depth 1 (older HA or different wrapper).
            found = esp32_dash::calendar_json::extract_array_field(resp, "forecast", forecast_arr);
          }
          if (!found) {
            ESP_LOGW("forecast", "No 'forecast' key in response — clearing display");
            id(wf_data_buf) = "";
            id(render_forecast).execute();
            return;
          }

          // Parse each day object from the array
          std::string new_buf;
          new_buf.reserve(1024);
          int day_count = 0;
          for (size_t pos = 0; pos < forecast_arr.size() && day_count < 7; pos++) {
            if (forecast_arr[pos] != '{') continue;

            size_t end = 0;
            if (!esp32_dash::calendar_json::extract_object_span(forecast_arr, pos, end)) {
              break;
            }

            std::string obj(forecast_arr, pos, end - pos + 1);
            pos = end;

            std::string dt;
            if (!esp32_dash::calendar_json::extract_string_field(obj, "datetime", dt)) continue;
            if (dt.size() < 10) continue;

            // Parse YYYY-MM-DD → day-of-week via mktime
            int year     = atoi(dt.c_str());
            int month    = atoi(dt.c_str() + 5);
            int day_num  = atoi(dt.c_str() + 8);

            struct tm tm_d = {};
            tm_d.tm_year = year - 1900;
            tm_d.tm_mon  = month - 1;
            tm_d.tm_mday = day_num;
            tm_d.tm_hour = 12;   // midday avoids DST edges shifting the date
            tm_d.tm_isdst = -1;  // let mktime resolve DST for this local date
            const char *day_names[] = {"SUN","MON","TUE","WED","THU","FRI","SAT"};
            const char *day_name = "---";
            if (mktime(&tm_d) != (time_t) -1 && tm_d.tm_wday >= 0 && tm_d.tm_wday < 7) {
              day_name = day_names[tm_d.tm_wday];
            }

            // Missing values must stay missing: defaulting templow to 0 would
            // drag the chart's y-range down to zero and print a bogus "0°".
            float high = 0.0f;
            float low = 0.0f;
            float precip = 0.0f;
            float prob_f = 0.0f;
            bool has_high = esp32_dash::calendar_json::extract_number_field(obj, "temperature", high);
            bool has_low  = esp32_dash::calendar_json::extract_number_field(obj, "templow", low);
            esp32_dash::calendar_json::extract_number_field(obj, "precipitation", precip);
            esp32_dash::calendar_json::extract_number_field(obj, "precipitation_probability", prob_f);
            int prob = (int)prob_f;
            if (prob < 0) prob = 0;
            if (prob > 100) prob = 100;
            if (precip < 0.0f) precip = 0.0f;

            std::string cond;
            esp32_dash::calendar_json::extract_string_field(obj, "condition", cond);
            if (cond.empty()) cond = "cloudy";
            for (char &c : cond) {
              if (c == '|' || c == '\n' || c == '\r') c = ' ';
            }

            // "DAYNAME|DAYNUM|HIGH|LOW|PRECIP|PROB|COND\n"
            // HIGH/LOW are left empty when the integration did not supply them.
            char nums[64];
            snprintf(nums, sizeof(nums), "|%d|", day_num);
            new_buf += day_name;
            new_buf += nums;
            if (has_high) {
              snprintf(nums, sizeof(nums), "%.1f", high);
              new_buf += nums;
            }
            new_buf += '|';
            if (has_low) {
              snprintf(nums, sizeof(nums), "%.1f", low);
              new_buf += nums;
            }
            snprintf(nums, sizeof(nums), "|%.2f|%d|", precip, prob);
            new_buf += nums;
            new_buf += cond;
            new_buf += '\n';
            day_count++;
          }

          ESP_LOGI("forecast", "Parsed %d days", day_count);
          id(wf_data_buf) = new_buf;
          if (day_count > 0) id(wf_last_fetch_ms) = millis();
          id(render_forecast).execute();


interval:
  # Auto-refresh while forecast view is active
  - interval: 30min
    then:
      - if:
          condition:
            lambda: 'return id(current_view) == 3;'
          then:
            - script.execute: fetch_forecast
