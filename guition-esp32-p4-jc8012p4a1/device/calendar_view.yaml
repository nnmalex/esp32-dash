            x: 190
            y: 352
            width: 900
            height: 80
            text: "No HA token configured\nAdd  ha_token: \"your-token\"  to packages.yaml"
            text_font: roboto_light26_font
            text_color: 0x555555
            text_align: center
            hidden: true

        # ---------------------------------------------------------------
        # Event details card — reparented to lv_layer_top() on boot and
        # filled by show_event_details. Tap anywhere to close.
        # ---------------------------------------------------------------
        - obj:
            id: ev_detail_overlay
            x: 0
            y: 0
            width: 1280
            height: 800
            bg_color: 0x000000
            bg_opa: 70%
            border_width: 0
            radius: 0
            pad_all: 0
            scrollable: false
            hidden: true
            on_click:
              - script.stop: show_event_details
              - lvgl.widget.hide: ev_detail_overlay
            widgets:
              - obj:
                  id: ev_detail_card
                  align: CENTER
                  width: 760
                  height: SIZE_CONTENT
                  bg_color: 0x1E1E1E
                  bg_opa: 100%
                  border_width: 6       # calendar-coloured bar on the left edge
                  border_side: LEFT
                  border_color: 0x4A90E2
                  radius: 16
                  pad_left: 40
                  pad_right: 40
                  pad_top: 32
                  pad_bottom: 32
                  scrollable: false
                  clickable: false
                  layout:
                    type: flex
                    flex_flow: COLUMN
                    pad_row: 14
                  widgets:
                    - label:
                        id: ev_detail_title
                        width: 100%
                        text: ""
                        text_font: roboto_light40_font
                        text_color: 0xFFFFFF
                        long_mode: wrap
                    - label:
                        id: ev_detail_when
                        width: 100%
                        text: ""
                        text_font: roboto_light30_font
                        text_color: 0x4A90E2
                    # Icon + text rows, hidden when empty
                    - obj:
