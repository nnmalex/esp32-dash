# =============================================================================
# CLOCK TIMEZONE
# =============================================================================
# Lets the user pick their timezone from a city list on the HA device page.
# The chosen zone is applied at runtime (see apply_timezone) so the clock and
# every other .now() / localtime() call returns correct local time — regardless
# of what timezone the firmware was compiled under.
#
# The compile-time timezone is pinned to UTC in time.yaml; this select
# overrides it at boot (via restore_value → on_value) and whenever the
# user changes the selection.
# =============================================================================


globals:
  - id: tz_posix
    type: std::string
    initial_value: '"UTC0"'


esphome:
  on_boot:
    priority: -10
    then:
      - script.execute: apply_timezone


select:
  - platform: template
    name: "Clock: Timezone"
    id: clock_timezone
    icon: "mdi:map-clock"
    entity_category: config
    optimistic: true
    restore_value: true
    initial_option: "UTC"
    options:
      - "UTC"
      - "(-11:00) Pago Pago"
      - "(-10:00) Honolulu"
      - "(-09:00) Anchorage"
      - "(-08:00) Los Angeles"
      - "(-07:00) Denver"
      - "(-07:00) Phoenix"
      - "(-06:00) Chicago"
      - "(-06:00) Mexico City"
