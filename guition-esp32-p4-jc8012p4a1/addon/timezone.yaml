      - "(-04:00) Halifax"
      - "(-04:00) Santiago"
      - "(-03:30) St. John's"
      - "(-03:00) Buenos Aires"
      - "(-03:00) Sao Paulo"
      - "(-01:00) Azores"
      - "(+00:00) Lisbon"
      - "(+00:00) London"
