      - "(+04:30) Kabul"
      - "(+05:00) Almaty"
      - "(+05:00) Karachi"
      - "(+05:30) Mumbai"
      - "(+05:45) Kathmandu"
      - "(+06:00) Dhaka"
      - "(+06:30) Yangon"
      - "(+07:00) Bangkok"
      - "(+07:00) Jakarta"
      - "(+08:00) Beijing"
      - "(+08:00) Hong Kong"
      - "(+08:00) Perth"
      - "(+08:00) Singapore"
      - "(+08:00) Taipei"
      - "(+09:00) Seoul"
      - "(+09:00) Tokyo"
