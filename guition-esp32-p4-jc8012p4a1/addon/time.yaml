# Home Assistant Time (used for play progress elapsed-time estimation in sensors.yaml)
time:
  - platform: sntp
    id: sntp_time
    servers:
      - ${ntp_server}

  - platform: homeassistant
    id: ha_time
    timezone: UTC
    # Minute-aligned UI refresh. A free-running 60 s interval starts at boot, so
    # the idle clock could show the previous minute for up to 59 s; a cron
    # trigger fires on the boundary (and catches up if the loop was blocked).
    on_time:
      - seconds: 0
        then:
          - if:
              condition:
                lambda: 'return id(current_view) == 0;'
              then:
                - script.execute: update_idle_clock
          - if:
              condition:
                lambda: 'return id(current_view) == 2;'
              then:
                - script.execute: position_cal_now_line
    on_time_sync:
      - lambda: |-
          // After reboot, HA may push media_position before time syncs.
          // Seed the timestamp now so the interval can start interpolating.
          // Prefer ha_position_epoch (from media_position_updated_at) for accuracy.
          if (id(last_position_timestamp) == 0 && id(media_position_sensor).has_state()) {
            id(last_position_timestamp) = id(ha_position_epoch) != 0
              ? id(ha_position_epoch)
              : id(ha_time).now().timestamp;
          }
          id(apply_timezone).execute();
          // fetch_calendar_data bails out on boot if time isn't valid yet; retry
          // now that we have a valid clock so the week grid and the idle agenda
          // are both pre-populated before the user first navigates to them.
          if (id(cal_events_buf).empty()) {
            id(fetch_calendar_data).execute();
          }
