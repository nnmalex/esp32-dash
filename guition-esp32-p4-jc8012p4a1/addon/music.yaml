# =============================================================================
# MUSIC DASHBOARD - HTTP request, album art image
# =============================================================================
# Required for online_image (album art from Home Assistant entity_picture).
# Placeholder image shown until art is downloaded.
#
# BYTE ORDER WARNING:
# Images use byte_order: little_endian to match the display's native format.
# However, ESPHome's Image::get_pixel() always decodes RGB565 as big-endian
# (via encode_uint16), so calling get_pixel() on these images returns
# scrambled colour channels. Any code that needs to read pixel data must
# access the raw buffer directly and reconstruct the uint16 in little-endian
# order:
#
#   lv_image_dsc_t *dsc = img->get_lv_image_dsc();
#   const uint8_t *data = dsc->data;
#   int pos = (x + y * width) * 2;
#   uint16_t rgb565 = data[pos] | (data[pos + 1] << 8);  // LE read
#   int r = ((rgb565 >> 11) & 0x1F); r = (r << 3) | (r >> 2);
#   int g = ((rgb565 >> 5)  & 0x3F); g = (g << 2) | (g >> 4);
#   int b = ( rgb565         & 0x1F); b = (b << 3) | (b >> 2);
#
# See addon/accent_color.yaml for a working example.
# =============================================================================

# Components served from this repo. Keep this on `main`: end users import the
# package from main, so a branch pin here would break their builds as soon as
# that branch is deleted.
#
# Note when adding a *new* component: ESPHome resolves every declared
# external_components source even when a local path override also supplies the
# component, so a component that is not on main yet fails CI on its own PR
# ("Could not find __init__.py file for component <name>"). Pin this ref to the
# PR branch to get CI green, then restore it to main on merge.
external_components:
  - source:
      type: git
      url: https://github.com/nnmalex/esp32-dash
      ref: main
      path: components
    components: [online_image, calendar_json, gsl3680]
    refresh: 1s

http_request:
  id: http_req
  verify_ssl: ${ha_verify_ssl}
  # ESP32 default is 512 bytes. Every read() constructs a WatchdogManager (a task
  # WDT reconfigure), so a 30 KB calendar response costs ~60 of them at 512 B and
  # ~8 at 4 KB. Callers read in matching 4 KB chunks.
  buffer_size_rx: 4096
  # timeout is deliberately left at the 4.5 s default. It applies per socket
  # operation, and the bulk of a calendar fetch is HA waiting on the upstream
  # provider (Google/CalDAV) before it sends headers — lowering it would fail
  # slow-but-valid fetches. fetch_calendar_data / fetch_forecast log
  # container->duration_ms so this can be revisited with real numbers.

# Images became platforms of the `image` component in ESPHome 2026.7; the old
# bare-list form is deprecated and removed in 2027.1.0. `platform: file` does not
# exist before 2026.7, hence the min_version bump in device.yaml.
image:
  - platform: file
    file: "https://github.com/nnmalex/esp32-dash/raw/main/guition-esp32-p4-jc8012p4a1/assets/placeholder.png"
    id: album_art_placeholder
    type: RGB565
    byte_order: little_endian

online_image:
  - url: "https://placehold.co/800x800/2d2d2d/555555"
    id: album_art_background
    format: AUTO
    type: RGB565
    byte_order: little_endian
    placeholder: album_art_placeholder
    # The art box on the music page (800 wide, 740 above the navbar). The
    # decoder scales the image to fit it once, at download, so LVGL can draw it
    # 1:1 — a zoomed image is re-transformed on every redraw, and the progress
    # and timer bars that overlap it redraw every second.
    resize: 740x740
    buffer_size: 262144
    on_download_finished:
      - script.execute:
          id: apply_downloaded_artwork
          cached: !lambda 'return cached;'
    on_error:
      - script.execute: handle_artwork_error

script:
  - id: apply_downloaded_artwork
    parameters:
      cached: bool   # HTTP 304: the same art is already in the buffer
    mode: restart
    then:
      - lvgl.widget.hide: artwork_error_label
      - lambda: |-
          auto *img = id(album_art_background);
          int iw = img->get_width();
          int ih = img->get_height();
          auto *w = id(album_art_background_widget);
          if (iw > 0 && ih > 0) {
            // Already fitted to the 740x740 box by the decoder: draw unscaled,
            // centred in the 800x740 panel.
            constexpr int display_w = 800;
            constexpr int display_h = 740;
            lv_image_set_scale(w, LV_SCALE_NONE);
            lv_obj_set_size(w, iw, ih);
            lv_obj_set_pos(w, (display_w - iw) / 2, (display_h - ih) / 2);
          }
      - lvgl.image.update:
          id: album_art_background_widget
          src: album_art_background
      - lvgl.widget.update:
          id: album_art_background_widget
          opa: 100%
      # Fade new art in rather than snapping it in. Affordable because the art
      # is drawn 1:1 (no transform); skipped for a 304 re-fetch of the same
      # image and when the music page is not on screen.
      - lambda: |-
          if (!cached && id(current_view) == 1)
            lv_obj_fade_in(id(album_art_background_widget), 250, 0);
      - script.execute: extract_accent_color

  - id: handle_artwork_error
    mode: restart
    then:
      - lambda: |-
          ESP_LOGW("artwork", "Artwork download failed: %s", id(last_artwork_url).c_str());
      - delay: 1s
      - lambda: |-
          if (!id(last_artwork_url).empty()) {
            ESP_LOGI("artwork", "Retrying artwork download: %s", id(last_artwork_url).c_str());
            id(album_art_background)->set_url(id(last_artwork_url));
            id(album_art_background)->update();
          }
