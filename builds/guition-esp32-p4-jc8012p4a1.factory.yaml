packages:
  core: !include guition-esp32-p4-jc8012p4a1.yaml

esphome:
  project:
    name: nnmalex.esp32-dash
    version: dev
  # One-shot ESP32-C6 coprocessor firmware check shortly after boot. This used to
  # be a 10 s interval guarded by an "already checked" flag, which kept firing
  # every 10 s for the life of the device to do nothing; on_boot runs once and
  # then stops on its own.
  on_boot:
    priority: -200
    then:
      - delay: 10s
      - if:
          condition:
            update.is_available: c6_firmware_update
          then:
            - logger.log: "Updating ESP32-C6 co-processor firmware..."
            - update.perform: c6_firmware_update
            - delay: 5s
            - lambda: 'App.safe_reboot();'

dashboard_import:
  package_import_url: github://nnmalex/esp32-dash/guition-esp32-p4-jc8012p4a1/esphome.yaml@main

update:
  - platform: esp32_hosted
    id: c6_firmware_update
    type: embedded
    path: network_adapter_esp32c6.bin
    sha256: "3ccfbc4feb0be29c7f5dbe50b0c5a7f0862f0b0c30fb28e5f5a4e1c2891c53f4"
