name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Both ends of what users build with: the supported minimum (min_version in
    # device.yaml), and the newest release, unpinned. HA add-on users move to new
    # ESPHome releases on their own, so a release that breaks the build should
    # turn CI red rather than surface as a failed install — 2026.9 removed
    # RealTimeClock::set_timezone() while CI only tested 2026.7.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            esphome: "esphome>=2026.7.0,<2026.8"
          - name: latest
            esphome: "esphome"
    name: build (ESPHome ${{ matrix.name }})

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Cache PlatformIO toolchain
        uses: actions/cache@v5.0.4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('builds/guition-esp32-p4-jc8012p4a1.yaml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install "${{ matrix.esphome }}"

      - name: Compile firmware
        run: esphome compile builds/guition-esp32-p4-jc8012p4a1.yaml

      # The factory build layers dashboard_import and the ESP32-C6 coprocessor
      # update onto the base config, and was previously never checked by CI.
      #
      # It needs builds/network_adapter_esp32c6.bin, which is not in the repo and
      # never has been — so the factory build cannot currently be validated from a
      # clean checkout. Skip rather than fail while that is true; the check starts
      # enforcing automatically once the blob is committed.
      - name: Validate factory build
        run: |
          if [ -f builds/network_adapter_esp32c6.bin ]; then
            esphome config builds/guition-esp32-p4-jc8012p4a1.factory.yaml
          else
            echo "::warning::Skipping factory build validation - builds/network_adapter_esp32c6.bin is missing from the repo, so builds/guition-esp32-p4-jc8012p4a1.factory.yaml cannot be validated or built."
          fi
