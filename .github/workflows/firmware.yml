name: Build firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Both ends of what users build with: the supported minimum (min_version in
    # device.yaml), and the newest release, unpinned. HA add-on users move to new
    # ESPHome releases on their own, so a release that breaks the build should
    # turn CI red rather than surface as a failed install — 2026.9 removed
    # RealTimeClock::set_timezone() while CI only tested 2026.7.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            esphome: "esphome>=2026.7.0,<2026.8"
          - name: latest
            esphome: "esphome"
    name: build (ESPHome ${{ matrix.name }})

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Cache PlatformIO toolchain
        uses: actions/cache@v5.0.4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('builds/guition-esp32-p4-jc8012p4a1.yaml') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install ESPHome
        run: pip install "${{ matrix.esphome }}"

      - name: Compile firmware
        run: esphome compile builds/guition-esp32-p4-jc8012p4a1.yaml

      # A clean compile is not enough: on the pre-v3 P4 the panel ships with,
      # too much static RAM aborts the panel at power-up, before ESPHome runs
      # (#63, #73). Fail the build below the startup heap known to boot. Only
      # on the latest release, which is what users build with: the threshold
      # was measured there, and older ESPHome/IDF lay memory out differently.
      - name: Check startup RAM headroom
        if: matrix.name == 'latest'
        run: python3 .github/scripts/check_startup_ram.py builds/.esphome/build

      # The factory build layers dashboard_import onto the base config.
      - name: Validate factory build
        run: esphome config builds/guition-esp32-p4-jc8012p4a1.factory.yaml
